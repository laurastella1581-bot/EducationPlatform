<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>연잎 위의 꼬마 사냥꾼</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #0a1628;
    font-family: 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
    overflow: hidden;
    height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
  }

  /* ── 배경 물결 애니메이션 ── */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background:
      radial-gradient(ellipse at 20% 80%, rgba(0,120,80,0.25) 0%, transparent 60%),
      radial-gradient(ellipse at 80% 20%, rgba(0,60,140,0.3) 0%, transparent 60%),
      linear-gradient(160deg, #0a1628 0%, #0d2b45 50%, #0a1f0f 100%);
    z-index: 0;
  }

  .stage {
    position: relative;
    z-index: 1;
    width: 100vw;
    height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
  }

  /* ── 뷰포트 래퍼 (슬라이드 + 오버레이 컨트롤 묶음) ── */
  .wrapper {
    position: relative;
    width: min(92vw, calc(100vh * 16/9 * 0.92));
    aspect-ratio: 16/9;
  }

  /* ── 슬라이드 뷰포트 ── */
  .viewport {
    position: absolute;
    inset: 0;
    border-radius: 18px;
    overflow: hidden;
    box-shadow:
      0 0 0 3px rgba(255,220,80,0.35),
      0 0 40px rgba(0,200,120,0.2),
      0 20px 60px rgba(0,0,0,0.7);
  }

  /* ── 슬라이드 트랙 ── */
  .track {
    display: flex;
    width: calc(15 * 100%);
    height: 100%;
    transition: transform 0.55s cubic-bezier(0.77,0,0.175,1);
  }

  .slide {
    flex: 0 0 calc(100% / 15);
    height: 100%;
    position: relative;
    overflow: hidden;
  }

  .slide img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
    user-select: none;
    -webkit-user-drag: none;
  }

  /* ── 화살표 버튼 ── */
  .arrow {
    position: absolute;
    top: 50%;
    transform: translateY(-50%);
    z-index: 10;
    background: rgba(0,0,0,0.45);
    border: 2px solid rgba(255,220,80,0.5);
    color: #ffe87a;
    border-radius: 50%;
    width: 52px;
    height: 52px;
    font-size: 22px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background 0.2s, transform 0.15s, border-color 0.2s;
    backdrop-filter: blur(6px);
  }
  .arrow:hover {
    background: rgba(255,180,0,0.3);
    border-color: #ffe87a;
    transform: translateY(-50%) scale(1.1);
  }
  .arrow:active { transform: translateY(-50%) scale(0.95); }
  .arrow.prev { left: 14px; }
  .arrow.next { right: 14px; }
  .arrow.disabled { opacity: 0.2; pointer-events: none; }

  /* ── 오버레이 컨트롤 바 (슬라이드 위 하단) ── */
  .controls {
    position: absolute;
    bottom: 16px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 20;
    display: flex;
    align-items: center;
    gap: 14px;
    background: rgba(0,0,0,0.38);
    backdrop-filter: blur(8px);
    border: 1px solid rgba(255,220,80,0.25);
    border-radius: 50px;
    padding: 7px 18px;
    white-space: nowrap;
  }

  /* 슬라이드 번호 */
  .counter {
    color: rgba(255,230,120,0.9);
    font-size: 14px;
    letter-spacing: 1px;
    min-width: 60px;
    text-align: center;
    font-weight: 600;
    text-shadow: 0 1px 4px rgba(0,0,0,0.6);
  }

  /* 도트 네비게이션 */
  .dots {
    display: flex;
    gap: 7px;
    align-items: center;
  }

  .dot {
    width: 9px;
    height: 9px;
    border-radius: 50%;
    background: rgba(255,255,255,0.25);
    border: 1.5px solid rgba(255,220,80,0.3);
    cursor: pointer;
    transition: all 0.25s;
    flex-shrink: 0;
  }
  .dot.active {
    background: #ffe87a;
    border-color: #ffe87a;
    transform: scale(1.35);
    box-shadow: 0 0 8px rgba(255,220,80,0.7);
  }
  .dot:hover:not(.active) {
    background: rgba(255,220,80,0.5);
    border-color: rgba(255,220,80,0.7);
  }

  /* 전체화면 버튼 */
  .btn-fs {
    background: rgba(255,255,255,0.08);
    border: 1.5px solid rgba(255,220,80,0.4);
    color: rgba(255,230,120,0.8);
    border-radius: 8px;
    padding: 5px 11px;
    font-size: 12px;
    cursor: pointer;
    transition: all 0.2s;
    backdrop-filter: blur(4px);
    white-space: nowrap;
  }
  .btn-fs:hover {
    background: rgba(255,180,0,0.2);
    color: #ffe87a;
    border-color: #ffe87a;
  }

  /* ── 키보드 힌트 ── */
  .hint {
    position: fixed;
    bottom: 12px;
    right: 16px;
    color: rgba(255,255,255,0.2);
    font-size: 11px;
    z-index: 5;
    letter-spacing: 0.3px;
  }

  /* ── 진행 바 ── */
  .progress-bar {
    position: absolute;
    bottom: 0;
    left: 0;
    height: 3px;
    background: linear-gradient(90deg, #ffe87a, #ff9d2e);
    transition: width 0.55s cubic-bezier(0.77,0,0.175,1);
    border-radius: 0 2px 0 0;
    z-index: 5;
    box-shadow: 0 0 8px rgba(255,180,0,0.7);
  }

  /* ── 슬라이드 전환 효과 (active 슬라이드 살짝 강조) ── */
  .slide { transition: filter 0.4s; }

  /* 전체화면일 때 조정 */
  :fullscreen .stage,
  :-webkit-full-screen .stage { background: #000; }
  :fullscreen body::before,
  :-webkit-full-screen body::before { display: none; }
</style>
</head>
<body>

<div class="stage">
  <div class="wrapper">
    <div class="viewport" id="viewport">
      <div class="track" id="track">
        <!-- 슬라이드 1~15 -->
        <div class="slide"><img src="Special_Pond_Talents/슬라이드1.PNG" alt="슬라이드 1" draggable="false"></div>
        <div class="slide"><img src="Special_Pond_Talents/슬라이드2.PNG" alt="슬라이드 2" draggable="false"></div>
        <div class="slide"><img src="Special_Pond_Talents/슬라이드3.PNG" alt="슬라이드 3" draggable="false"></div>
        <div class="slide"><img src="Special_Pond_Talents/슬라이드4.PNG" alt="슬라이드 4" draggable="false"></div>
        <div class="slide"><img src="Special_Pond_Talents/슬라이드5.PNG" alt="슬라이드 5" draggable="false"></div>
        <div class="slide"><img src="Special_Pond_Talents/슬라이드6.PNG" alt="슬라이드 6" draggable="false"></div>
        <div class="slide"><img src="Special_Pond_Talents/슬라이드7.PNG" alt="슬라이드 7" draggable="false"></div>
        <div class="slide"><img src="Special_Pond_Talents/슬라이드8.PNG" alt="슬라이드 8" draggable="false"></div>
        <div class="slide"><img src="Special_Pond_Talents/슬라이드9.PNG" alt="슬라이드 9" draggable="false"></div>
        <div class="slide"><img src="Special_Pond_Talents/슬라이드10.PNG" alt="슬라이드 10" draggable="false"></div>
        <div class="slide"><img src="Special_Pond_Talents/슬라이드11.PNG" alt="슬라이드 11" draggable="false"></div>
        <div class="slide"><img src="Special_Pond_Talents/슬라이드12.PNG" alt="슬라이드 12" draggable="false"></div>
        <div class="slide"><img src="Special_Pond_Talents/슬라이드13.PNG" alt="슬라이드 13" draggable="false"></div>
        <div class="slide"><img src="Special_Pond_Talents/슬라이드14.PNG" alt="슬라이드 14" draggable="false"></div>
        <div class="slide"><img src="Special_Pond_Talents/슬라이드15.PNG" alt="슬라이드 15" draggable="false"></div>
      </div>
      <div class="progress-bar" id="progressBar"></div>
    </div>

    <!-- 화살표: wrapper 기준 배치 → overflow:hidden 에 안 잘림 -->
    <button class="arrow prev" id="prevBtn" onclick="go(-1)">&#10094;</button>
    <button class="arrow next" id="nextBtn" onclick="go(1)">&#10095;</button>

    <!-- 컨트롤 바: 슬라이드 이미지 위에 오버레이 -->
    <div class="controls">
      <span class="counter" id="counter">1 / 15</span>
      <div class="dots" id="dots"></div>
      <button class="btn-fs" onclick="toggleFS()">⛶ 전체화면</button>
    </div>
  </div>
</div>

<div class="hint">← → 방향키 · 스페이스바로 이동</div>

<script>
  const TOTAL = 15;
  let cur = 0;
  let startX = null;

  const track = document.getElementById('track');
  const counter = document.getElementById('counter');
  const prevBtn = document.getElementById('prevBtn');
  const nextBtn = document.getElementById('nextBtn');
  const dotsEl = document.getElementById('dots');
  const progressBar = document.getElementById('progressBar');
  const viewport = document.getElementById('viewport');

  // 도트 생성
  for (let i = 0; i < TOTAL; i++) {
    const d = document.createElement('div');
    d.className = 'dot' + (i === 0 ? ' active' : '');
    d.addEventListener('click', () => goTo(i));
    dotsEl.appendChild(d);
  }

  function update() {
    const pct = (100 / TOTAL) * cur;
    track.style.transform = `translateX(-${pct}%)`;
    counter.textContent = `${cur + 1} / ${TOTAL}`;
    progressBar.style.width = `${((cur + 1) / TOTAL) * 100}%`;
    prevBtn.classList.toggle('disabled', cur === 0);
    nextBtn.classList.toggle('disabled', cur === TOTAL - 1);
    document.querySelectorAll('.dot').forEach((d, i) => {
      d.classList.toggle('active', i === cur);
    });
  }

  function go(dir) { goTo(cur + dir); }

  function goTo(idx) {
    if (idx < 0 || idx >= TOTAL) return;
    cur = idx;
    update();
  }

  // 키보드
  document.addEventListener('keydown', e => {
    if (e.key === 'ArrowRight' || e.key === ' ') { e.preventDefault(); go(1); }
    if (e.key === 'ArrowLeft') { e.preventDefault(); go(-1); }
    if (e.key === 'Home') goTo(0);
    if (e.key === 'End') goTo(TOTAL - 1);
    if (e.key === 'f' || e.key === 'F') toggleFS();
  });

  // 터치/스와이프
  viewport.addEventListener('touchstart', e => { startX = e.touches[0].clientX; }, { passive: true });
  viewport.addEventListener('touchend', e => {
    if (startX === null) return;
    const diff = startX - e.changedTouches[0].clientX;
    if (Math.abs(diff) > 40) go(diff > 0 ? 1 : -1);
    startX = null;
  }, { passive: true });

  // 마우스 드래그
  let mouseStartX = null;
  viewport.addEventListener('mousedown', e => { mouseStartX = e.clientX; });
  viewport.addEventListener('mouseup', e => {
    if (mouseStartX === null) return;
    const diff = mouseStartX - e.clientX;
    if (Math.abs(diff) > 40) go(diff > 0 ? 1 : -1);
    mouseStartX = null;
  });

  // 전체화면
  function toggleFS() {
    if (!document.fullscreenElement) {
      document.documentElement.requestFullscreen().catch(() => {});
    } else {
      document.exitFullscreen();
    }
  }

  update();
</script>
</body>
</html>
