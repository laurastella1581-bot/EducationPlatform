<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>친구들의 비밀 일기장</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Gaegu:wght@300;400;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Gaegu', cursive;
            background-color: #FDFCF0;
            touch-action: manipulation;
        }
        .character-stage {
            position: relative;
            width: 260px;
            height: 260px;
        }
        .layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .item-slot {
            transition: all 0.2s;
            cursor: pointer;
        }
        .item-slot:hover { transform: scale(1.05); }
        .selected-ring { border: 4px solid #FBBF24 !important; background-color: #FEF3C7 !important; }
        
        .diary-paper {
            background-image: radial-gradient(#E5E7EB 1.5px, transparent 1.5px);
            background-size: 24px 24px;
        }

        .fade-in { animation: fadeIn 0.4s ease-out; }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* 애니메이션 효과 */
        .bounce { animation: bounce 2s infinite; }
        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        /* 스크롤바 디자인 */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #f1f1f1; border-radius: 10px; }
        ::-webkit-scrollbar-thumb { background: #fbbf24; border-radius: 10px; }
    </style>
</head>
<body class="min-h-screen p-4 md:p-8 flex items-center justify-center">

    <div class="max-w-6xl w-full bg-white rounded-[3rem] shadow-2xl overflow-hidden border-[10px] border-yellow-200 flex flex-col md:flex-row">
        
        <!-- 왼쪽: 캐릭터 선택 및 꾸미기 영역 -->
        <div class="w-full md:w-[45%] bg-yellow-50 p-6 flex flex-col items-center border-b-4 md:border-b-0 md:border-r-4 border-dashed border-yellow-200">
            <div class="w-full flex justify-end mb-2"><button type="button" onclick="if (window.parent && window.parent.closeDiaryModal) { window.parent.closeDiaryModal(); } else { window.close(); }" class="px-3 py-1 rounded-full bg-red-100 text-red-600 font-bold text-sm shadow-sm border border-red-300 hover:bg-red-200 transition cursor-pointer">✕ 닫기</button></div><h1 class="text-4xl font-bold text-yellow-700 mb-6 text-center">🌟 친구들의 비밀 일기장</h1>
            
            <!-- 캐릭터 스테이지 (중앙 전시 공간) -->
            <div class="character-stage bg-white rounded-full border-8 border-white shadow-xl mb-6 relative overflow-visible">
                <!-- 선택된 캐릭터 이미지 레이어 -->
                <div id="char-layer" class="layer">
                    <img id="main-character" src="../characters/quokka.png" class="w-full h-full object-contain fade-in" alt="Main Character">
                </div>
                
                <!-- 꾸미기 레이어 (안경) -->
                <div id="acc-layer" class="layer hidden z-20">
                    <svg viewBox="0 0 200 200" class="w-48 h-48 opacity-80">
                        <circle cx="75" cy="95" r="15" stroke="#333" stroke-width="4" fill="none" />
                        <circle cx="125" cy="95" r="15" stroke="#333" stroke-width="4" fill="none" />
                        <line x1="90" y1="95" x2="110" y2="95" stroke="#333" stroke-width="4" />
                    </svg>
                </div>

                <!-- 간식 레이어 -->
                <div id="snack-layer" class="layer hidden z-30 flex items-end justify-center pb-4">
                    <img id="snack-img" src="../starlot-snack.png" class="w-20 h-20 object-contain drop-shadow-lg bounce" alt="Snack Item">
                </div>
            </div>

            <!-- 1. 친구 선택 코너 -->
            <div class="w-full mb-6">
                <p class="text-xl font-bold mb-3 text-yellow-800 ml-1">🐾 누구랑 대화할까?</p>
                <div class="grid grid-cols-2 gap-3 max-h-56 overflow-y-auto p-1">
                    <button onclick="selectFriend('../characters/quokka.png', '모험대장 쿼카')" class="item-slot char-btn selected-ring p-2 bg-white rounded-2xl border-4 border-transparent flex flex-col items-center gap-1 shadow-sm">
                        <img src="../characters/quokka.png" class="w-16 h-16 object-contain">
                        <span class="text-lg font-bold text-gray-700">모험대장 쿼카</span>
                    </button>
                    <button onclick="selectFriend('../characters/quora.png', '쿼카 친구 쿼라')" class="item-slot char-btn p-2 bg-white rounded-2xl border-4 border-transparent flex flex-col items-center gap-1 shadow-sm">
                        <img src="../characters/quora.png" class="w-16 h-16 object-contain">
                        <span class="text-lg font-bold text-gray-700">쿼카 친구 쿼라</span>
                    </button>
                    <button onclick="selectFriend('../characters/connie.png', '여동생 커니')" class="item-slot char-btn p-2 bg-white rounded-2xl border-4 border-transparent flex flex-col items-center gap-1 shadow-sm">
                        <img src="../characters/connie.png" class="w-16 h-16 object-contain">
                        <span class="text-lg font-bold text-gray-700">여동생 커니</span>
                    </button>
                    <button onclick="selectFriend('../characters/louie.png', '남동생 루이')" class="item-slot char-btn p-2 bg-white rounded-2xl border-4 border-transparent flex flex-col items-center gap-1 shadow-sm">
                        <img src="../characters/louie.png" class="w-16 h-16 object-contain">
                        <span class="text-lg font-bold text-gray-700">남동생 루이</span>
                    </button>
                    <button onclick="selectFriend('../characters/luna.png', '북극여우 루나')" class="item-slot char-btn p-2 bg-white rounded-2xl border-4 border-transparent flex flex-col items-center gap-1 shadow-sm">
                        <img src="../characters/luna.png" class="w-16 h-16 object-contain">
                        <span class="text-lg font-bold text-gray-700">북극여우 루나</span>
                    </button>
                    <button onclick="selectFriend('../characters/luna.png', '루나 선생님')" class="item-slot char-btn p-2 bg-white rounded-2xl border-4 border-transparent flex flex-col items-center gap-1 shadow-sm">
                        <img src="../characters/luna.png" class="w-16 h-16 object-contain">
                        <span class="text-lg font-bold text-gray-700">루나 선생님</span>
                    </button>
                    <button onclick="selectFriend('../characters/pika.png', '피카')" class="item-slot char-btn p-2 bg-white rounded-2xl border-4 border-transparent flex flex-col items-center gap-1 shadow-sm">
                        <img src="../characters/pika.png" class="w-16 h-16 object-contain">
                        <span class="text-lg font-bold text-gray-700">피카</span>
                    </button>
                    <button onclick="selectFriend('../characters/moss-b.png', '고슴도치 이끼')" class="item-slot char-btn p-2 bg-white rounded-2xl border-4 border-transparent flex flex-col items-center gap-1 shadow-sm">
                        <img src="../characters/moss-b.png" class="w-16 h-16 object-contain">
                        <span class="text-lg font-bold text-gray-700">고슴도치 이끼</span>
                    </button>
                </div>
            </div>

            <!-- 2. 캐릭터 꾸미기 코너 -->
            <div class="w-full mb-6">
                <p class="text-xl font-bold mb-3 text-yellow-800 ml-1">✨ 캐릭터 꾸미기</p>
                <div class="flex gap-3">
                    <button onclick="toggleAcc()" class="flex-1 py-3 bg-white rounded-2xl border-2 border-yellow-200 flex items-center justify-center gap-2 shadow-sm hover:bg-yellow-100 transition">
                        <span class="text-2xl">👓</span>
                        <span class="text-xl font-bold text-gray-700">반짝 안경</span>
                    </button>
                </div>
            </div>

            <!-- 3. 간식 코너 -->
            <div class="w-full">
                <p class="text-xl font-bold mb-3 text-yellow-800 ml-1">🍭 맛있는 간식</p>
                <div class="flex gap-3">
                    <button onclick="toggleSnack('../starlot-snack.png')" class="flex-1 p-2 bg-white rounded-2xl border-2 border-yellow-200 shadow-sm hover:bg-yellow-100 transition flex flex-col items-center">
                        <img src="../starlot-snack.png" class="h-10 mb-1 object-contain">
                        <span class="text-lg font-bold text-gray-600">스타랏</span>
                    </button>
                    <button onclick="toggleSnack('../pipdew-snack.jpg')" class="flex-1 p-2 bg-white rounded-2xl border-2 border-yellow-200 shadow-sm hover:bg-yellow-100 transition flex flex-col items-center">
                        <img src="../pipdew-snack.jpg" class="h-10 mb-1 object-contain">
                        <span class="text-lg font-bold text-gray-600">핍듀</span>
                    </button>
                    <button onclick="toggleSnack('../forest-friends/starrat-friends.png')" class="flex-1 p-2 bg-white rounded-2xl border-2 border-yellow-200 shadow-sm hover:bg-yellow-100 transition flex flex-col items-center">
                        <img src="../forest-friends/starrat-friends.png" class="h-10 mb-1 object-contain">
                        <span class="text-lg font-bold text-gray-600">다같이 냠냠</span>
                    </button>
                </div>
            </div>
        </div>

        <!-- 오른쪽: 글쓰기 및 답장 영역 -->
        <div class="w-full md:w-[55%] p-8 flex flex-col">
            <div class="flex-grow">
                <div class="flex items-center justify-between mb-6">
                    <h2 class="text-3xl font-bold text-gray-800">✍️ <span id="friend-display-name" class="text-yellow-600">모험대장 쿼카</span>와 대화하기</h2>
                    <div class="text-4xl">💭</div>
                </div>
                
                <div class="diary-paper p-6 bg-white border-4 border-yellow-100 rounded-[2.5rem] shadow-inner mb-6">
                    <p class="text-xl text-gray-500 mb-2">안녕! 오늘 어떤 일이 있었는지 자유롭게 써봐.</p>
                    <textarea id="thought-input" 
                        class="w-full h-72 text-2xl bg-transparent border-none focus:ring-0 resize-none leading-relaxed text-gray-700"
                        placeholder="나만 알고 싶은 비밀, 자랑하고 싶은 일 모두 좋아!"></textarea>
                </div>

                <button onclick="saveThought()" class="w-full py-5 bg-yellow-400 text-white text-3xl font-bold rounded-[2rem] shadow-lg hover:bg-yellow-500 transition active:scale-95 border-b-8 border-yellow-600">
                    비밀 창고에 저장!
                </button>
            </div>

            <!-- 랜덤 답장 영역 -->
            <div id="reply-bubble" class="mt-8 hidden p-5 bg-blue-50 border-2 border-blue-200 rounded-3xl fade-in relative shadow-md">
                <div class="absolute -top-4 left-8 text-2xl">🦜</div>
                <p id="reply-text" class="text-xl text-blue-800 italic font-bold text-center"></p>
            </div>
        </div>
    </div>

    <!-- 저장 기록 버튼 (플로팅) -->
    <div class="fixed bottom-4 right-4 group">
        <button onclick="toggleHistory()" class="w-16 h-16 bg-yellow-500 text-white rounded-full shadow-2xl flex items-center justify-center text-3xl hover:bg-yellow-600 transition">📖</button>
        <div id="history-panel" class="hidden absolute bottom-20 right-0 w-80 bg-white rounded-3xl shadow-2xl border-4 border-yellow-200 p-6 max-h-[500px] overflow-y-auto z-50">
            <h3 class="text-2xl font-bold mb-4 border-b-2 border-yellow-100 pb-2">📜 우리들의 기록</h3>
            <div id="history-content" class="space-y-4">
                <!-- 기록들이 여기에 표시됩니다 -->
            </div>
        </div>
    </div>

    <script>
        let currentFriendName = "모험대장 쿼카";
        let history = JSON.parse(localStorage.getItem('forest_diary_v4')) || [];

        const warmReplies = [
            "우와, 정말 대단한 하루였네!",
            "네가 한 생각은 정말 특별해. 소중히 간직할게!",
            "퐁당잎처럼 기분이 싱그러워지는 이야기야.",
            "스타랏처럼 반짝반짝 빛나는 너의 마음이 느껴져.",
            "언제나 네 편인 거 알지? 또 들려줘!",
            "그건 정말 멋진 생각이야. 너는 최고야!",
            "오늘도 수고 많았어, 친구야!",
            "너의 비밀은 내가 꼭 지켜줄게!"
        ];

        window.onload = () => {
            renderHistory();
        };

        // 친구 선택 함수
        function selectFriend(imgSrc, name) {
            const mainImg = document.getElementById('main-character');
            mainImg.classList.remove('fade-in');
            void mainImg.offsetWidth; // 애니메이션 재트리거
            mainImg.src = imgSrc;
            mainImg.classList.add('fade-in');
            
            document.getElementById('friend-display-name').innerText = name;
            currentFriendName = name;

            document.querySelectorAll('.char-btn').forEach(btn => btn.classList.remove('selected-ring'));
            event.currentTarget.classList.add('selected-ring');
        }

        // 안경 토글 함수
        function toggleAcc() {
            document.getElementById('acc-layer').classList.toggle('hidden');
        }

        // 간식 토글 함수
        function toggleSnack(imgSrc) {
            const layer = document.getElementById('snack-layer');
            const img = document.getElementById('snack-img');
            
            if (img.src.includes(imgSrc) && !layer.classList.contains('hidden')) {
                layer.classList.add('hidden');
            } else {
                img.src = imgSrc;
                layer.classList.remove('hidden');
            }
        }

        // 일기 저장 함수
        function saveThought() {
            const input = document.getElementById('thought-input');
            const text = input.value.trim();
            if (!text) return;

            const entry = {
                id: Date.now(),
                friend: currentFriendName,
                content: text,
                date: new Date().toLocaleString('ko-KR', { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' }),
                reply: warmReplies[Math.floor(Math.random() * warmReplies.length)]
            };

            history.unshift(entry);
            localStorage.setItem('forest_diary_v4', JSON.stringify(history));

            // 답장 표시
            const bubble = document.getElementById('reply-bubble');
            const replyText = document.getElementById('reply-text');
            replyText.innerText = `"${entry.reply}"`;
            bubble.classList.remove('hidden');

            input.value = "";
            renderHistory();
        }

        // 기록 렌더링 함수
        function renderHistory() {
            const content = document.getElementById('history-content');
            content.innerHTML = history.length ? "" : "<p class='text-gray-400 text-center text-xl'>아직 보관된 이야기가 없어요.</p>";

            history.forEach(item => {
                const div = document.createElement('div');
                div.className = "p-4 bg-yellow-50 rounded-2xl border border-yellow-100 shadow-sm";
                div.innerHTML = `
                    <div class="flex justify-between text-sm text-yellow-700 font-bold mb-1">
                        <span>${item.friend}</span>
                        <span>${item.date}</span>
                    </div>
                    <p class="text-xl text-gray-800 mb-2">${item.content}</p>
                    <div class="text-lg italic text-blue-500 font-bold border-t border-yellow-200 pt-1">🦜 ${item.reply}</div>
                `;
                content.appendChild(div);
            });
        }

        // 기록창 토글 함수
        function toggleHistory() {
            document.getElementById('history-panel').classList.toggle('hidden');
        }
    </script>
</body>
</html>
