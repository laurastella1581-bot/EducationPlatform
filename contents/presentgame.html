<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>프레젠트 게임 - 대인관계지능 놀이</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Pretendard', sans-serif;
            background: linear-gradient(135deg, #fdfbfb 0%, #ebedee 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0;
            overflow-x: hidden;
        }
        .card-enter {
            animation: slideUp 0.5s ease-out forwards;
        }
        @keyframes slideUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .gift-bounce {
            animation: bounce 2s infinite;
        }
        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }
        .confetti {
            position: absolute;
            width: 10px;
            height: 10px;
            background-color: #f00;
            animation: fall 3s linear infinite;
        }
        @keyframes fall {
            to { transform: translateY(100vh) rotate(360deg); }
        }
    </style>
</head>
<body class="p-4 md:p-8">

    <div id="game-container" class="max-w-2xl w-full bg-white rounded-3xl shadow-2xl overflow-hidden relative">
        <!-- Progress Bar -->
        <div id="progress-bar" class="h-2 bg-pink-100 w-full">
            <div id="progress-fill" class="h-full bg-pink-500 transition-all duration-500" style="width: 0%"></div>
        </div>

        <!-- Main Content Area -->
        <div id="content" class="p-8">
            <!-- Start Screen -->
            <div id="start-screen" class="text-center card-enter">
                <div class="text-6xl mb-6 gift-bounce">🎁</div>
                <h1 class="text-3xl font-extrabold text-gray-800 mb-4">프레젠트 게임</h1>
                <p class="text-gray-600 mb-8 leading-relaxed">
                    친구들의 고민과 관심사를 잘 듣고,<br>
                    그들에게 딱 맞는 <strong>최고의 선물</strong>을 골라주세요!<br>
                    상대방의 마음을 읽는 '대인관계 지능'을 발휘해볼까요?
                </p>
                <button onclick="showFriendSelection()" class="bg-pink-500 hover:bg-pink-600 text-white font-bold py-4 px-10 rounded-2xl transition-all transform hover:scale-105 active:scale-95 shadow-lg">
                    게임 시작하기
                </button>
            </div>

            <!-- Friend Selection Screen -->
            <div id="selection-screen" class="hidden card-enter">
                <h2 class="text-2xl font-bold text-gray-800 mb-6 text-center">선물을 줄 친구를 선택하세요</h2>
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4" id="friend-list">
                    <!-- Friends will be injected here -->
                </div>
            </div>

            <!-- Detail & Gift Choice Screen -->
            <div id="gift-screen" class="hidden card-enter">
                <div id="friend-detail" class="mb-8 text-center">
                    <!-- Friend info will be injected here -->
                </div>
                <h3 class="text-xl font-bold text-gray-800 mb-4">어떤 선물이 가장 좋을까요?</h3>
                <div class="grid grid-cols-2 sm:grid-cols-3 gap-3" id="gift-list">
                    <!-- Gifts will be injected here -->
                </div>
                <div class="mt-8 flex justify-between">
                    <button onclick="showFriendSelection()" class="text-gray-400 hover:text-gray-600 font-medium">← 친구 다시 고르기</button>
                </div>
            </div>

            <!-- Result Screen -->
            <div id="result-screen" class="hidden text-center card-enter">
                <div id="result-emoji" class="text-7xl mb-4"></div>
                <h2 id="result-title" class="text-3xl font-bold mb-4"></h2>
                <p id="result-message" class="text-gray-600 mb-8 px-4"></p>
                <div id="result-explanation" class="bg-gray-50 p-4 rounded-xl mb-8 text-sm text-gray-500 text-left"></div>
                <button onclick="resetGame()" class="bg-gray-800 hover:bg-black text-white font-bold py-3 px-8 rounded-xl transition-all">
                    처음으로 돌아가기
                </button>
            </div>
        </div>
    </div>

    <script>
        const friends = [
            {
                id: 1,
                name: "민수",
                emoji: "⚽",
                description: "축구를 정말 좋아하지만 요즘 발목을 조금 다쳐서 집에서 쉬고 있어. 운동을 못 해서 몸이 찌뿌둥하다고 해.",
                interests: ["운동", "활동적", "회복"],
                color: "blue"
            },
            {
                id: 2,
                name: "지우",
                emoji: "🎨",
                description: "요즘 그림 그리는 재미에 푹 빠졌어. 하지만 색깔을 섞을 때 원하는 느낌이 잘 안 나서 고민 중이래.",
                interests: ["예술", "창의력", "색깔"],
                color: "purple"
            },
            {
                id: 3,
                name: "나래",
                emoji: "📚",
                description: "시험 기간이라 잠을 거의 못 잤대. 눈이 자꾸 감기고 집중력이 떨어져서 힘들어하고 있어.",
                interests: ["휴식", "집중", "졸음"],
                color: "green"
            },
            {
                id: 4,
                name: "호찬",
                emoji: "🎮",
                description: "혼자 게임하는 걸 좋아하지만, 사실 친구들과 다 같이 신나게 웃으며 놀고 싶어 하는 마음도 있어.",
                interests: ["함께", "재미", "사교적"],
                color: "orange"
            }
        ];

        const gifts = [
            { id: 1, name: "축구공", emoji: "⚽", tags: ["운동"], feedback: "몸이 아픈 민수에겐 오히려 속상한 선물이 될 수 있어요." },
            { id: 2, name: "컬러 휠 가이드", emoji: "🎨", tags: ["색깔", "예술"], feedback: "색 조합을 고민하던 지우에게 정말 실용적인 도움을 줄 수 있어요!" },
            { id: 3, name: "따뜻한 안대", emoji: "😴", tags: ["휴식", "회복"], feedback: "잠이 부족한 나래에게 꿀맛 같은 휴식을 선물했네요!" },
            { id: 4, name: "보드게임 세트", emoji: "🎲", tags: ["함께", "사교적"], feedback: "친구들과 어울리고 싶어 하던 호찬이에게 딱 맞는 제안이에요!" },
            { id: 5, name: "에너지 드링크", emoji: "⚡", tags: ["집중"], feedback: "나래에게 도움은 되지만, 건강을 생각한다면 휴식이 더 좋을지도 몰라요." },
            { id: 6, name: "손목 보호대", emoji: "🩹", tags: ["회복"], feedback: "부상 중인 민수가 다시 운동장에 나갈 날을 응원하는 마음이 전해졌어요." },
            { id: 7, name: "스케치북", emoji: "📒", tags: ["예술"], feedback: "지우에겐 좋지만, 지우가 진짜 고민하던 건 '색깔'이었답니다." },
            { id: 8, name: "비타민", emoji: "💊", tags: ["회복", "집중"], feedback: "피곤한 친구들에게 두루두루 좋은 선물이네요!" }
        ];

        let selectedFriend = null;

        function updateProgress(val) {
            document.getElementById('progress-fill').style.width = val + '%';
        }

        function showScreen(screenId) {
            const screens = ['start-screen', 'selection-screen', 'gift-screen', 'result-screen'];
            screens.forEach(id => {
                document.getElementById(id).classList.add('hidden');
            });
            document.getElementById(screenId).classList.remove('hidden');
        }

        function showFriendSelection() {
            showScreen('selection-screen');
            updateProgress(33);
            const list = document.getElementById('friend-list');
            list.innerHTML = '';
            friends.forEach(f => {
                const div = document.createElement('div');
                div.className = `p-6 border-2 border-gray-100 rounded-2xl cursor-pointer hover:border-pink-300 hover:bg-pink-50 transition-all flex items-center space-x-4`;
                div.onclick = () => selectFriend(f);
                div.innerHTML = `
                    <div class="text-4xl bg-white p-3 rounded-xl shadow-sm">${f.emoji}</div>
                    <div>
                        <h3 class="font-bold text-lg">${f.name}</h3>
                        <p class="text-sm text-gray-500 truncate w-32 md:w-40">${f.description}</p>
                    </div>
                `;
                list.appendChild(div);
            });
        }

        function selectFriend(friend) {
            selectedFriend = friend;
            showScreen('gift-screen');
            updateProgress(66);
            
            const detail = document.getElementById('friend-detail');
            detail.innerHTML = `
                <div class="inline-block text-6xl mb-4 p-4 bg-${friend.color}-50 rounded-full">${friend.emoji}</div>
                <h2 class="text-2xl font-bold text-gray-800">${friend.name}의 이야기</h2>
                <div class="mt-4 p-5 bg-gray-50 rounded-2xl text-gray-700 italic leading-relaxed">
                    "${friend.description}"
                </div>
            `;

            const giftList = document.getElementById('gift-list');
            giftList.innerHTML = '';
            gifts.forEach(g => {
                const btn = document.createElement('button');
                btn.className = "p-4 border border-gray-100 rounded-xl hover:bg-white hover:shadow-md hover:border-pink-200 transition-all flex flex-col items-center justify-center space-y-2 group";
                btn.onclick = () => giveGift(g);
                btn.innerHTML = `
                    <span class="text-3xl group-hover:scale-110 transition-transform">${g.emoji}</span>
                    <span class="text-xs font-semibold text-gray-600">${g.name}</span>
                `;
                giftList.appendChild(btn);
            });
        }

        function giveGift(gift) {
            updateProgress(100);
            showScreen('result-screen');
            
            const isMatch = gift.tags.some(tag => selectedFriend.interests.includes(tag));
            const resultEmoji = document.getElementById('result-emoji');
            const resultTitle = document.getElementById('result-title');
            const resultMessage = document.getElementById('result-message');
            const resultExplanation = document.getElementById('result-explanation');

            if (isMatch) {
                resultEmoji.innerText = "❤️";
                resultTitle.innerText = "성공적인 선물!";
                resultTitle.className = "text-3xl font-bold text-pink-600 mb-4";
                createConfetti();
            } else {
                resultEmoji.innerText = "😮";
                resultTitle.innerText = "조금 아쉬워요";
                resultTitle.className = "text-3xl font-bold text-gray-700 mb-4";
            }

            resultMessage.innerHTML = `<strong>${selectedFriend.name}</strong>에게 <strong>${gift.name}</strong>를 선물했습니다.<br>${gift.feedback}`;
            
            resultExplanation.innerHTML = `
                <strong>분석 결과:</strong><br>
                ${selectedFriend.name}는 현재 <strong>${selectedFriend.interests.join(', ')}</strong>와 관련된 상황에 처해 있었어요. 
                당신이 고른 ${gift.name}의 속성인 <strong>${gift.tags.join(', ')}</strong>가 상대방의 필요와 얼마나 일치했는지 생각해보세요.
            `;
        }

        function createConfetti() {
            for(let i=0; i<50; i++) {
                const c = document.createElement('div');
                c.className = 'confetti';
                c.style.left = Math.random() * 100 + 'vw';
                c.style.backgroundColor = ['#ff0', '#f0f', '#0ff', '#f00', '#0f0'][Math.floor(Math.random()*5)];
                c.style.animationDuration = (Math.random() * 2 + 1) + 's';
                c.style.opacity = Math.random();
                document.body.appendChild(c);
                setTimeout(() => c.remove(), 3000);
            }
        }

        function resetGame() {
            selectedFriend = null;
            updateProgress(0);
            showScreen('start-screen');
        }
    </script>
</body>
</html>
