<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>치킨차차 - 메모리 레이싱 게임</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Jua&display=swap');

        body {
            font-family: 'Jua', sans-serif;
            background-color: #f0fdf4;
            overflow-x: hidden;
            touch-action: manipulation;
        }

        .game-container {
            position: relative;
            width: 100%;
            max-width: 800px;
            aspect-ratio: 1 / 1;
            margin: 0 auto;
        }

        /* 중앙 마당 타일 스타일 */
        .yard-container {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
            width: 50%;
            z-index: 10;
        }

        .yard-tile {
            aspect-ratio: 1/1;
            background: #fff;
            border: 4px solid #fbbf24;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: 0 4px 0 #d97706;
            user-select: none;
        }

        .yard-tile.flipped {
            transform: rotateY(180deg);
            background: #fef3c7;
        }

        .yard-tile:active {
            transform: scale(0.9) translateY(4px);
            box-shadow: 0 0 0 #d97706;
        }

        /* 외곽 트랙 타일 스타일 */
        .track-tile {
            position: absolute;
            width: 10%;
            aspect-ratio: 1/1;
            background: white;
            border: 3px solid #6366f1;
            border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%; /* 달걀 모양 */
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
            transform-origin: center;
            box-shadow: 0 3px 6px rgba(0,0,0,0.1);
            transition: transform 0.5s ease;
        }

        /* 치킨 말 스타일 */
        .chicken {
            position: absolute;
            width: 8%;
            aspect-ratio: 1/1;
            z-index: 20;
            transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            pointer-events: none;
        }

        .chicken-body {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.5rem;
            filter: drop-shadow(0 4px 4px rgba(0,0,0,0.2));
            position: relative;
        }

        .feathers-count {
            position: absolute;
            top: -15px;
            right: -15px;
            background: #ef4444;
            color: white;
            border-radius: 50%;
            width: 24px;
            height: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.8rem;
            border: 2px solid white;
        }

        .active-turn {
            animation: bounce 1s infinite;
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        .message-box {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0,0,0,0.8);
            color: white;
            padding: 12px 24px;
            border-radius: 999px;
            font-size: 1.1rem;
            z-index: 100;
            opacity: 0;
            transition: opacity 0.3s;
            pointer-events: none;
        }

        .message-box.show {
            opacity: 1;
        }

        .highlight-tile {
            border-color: #f59e0b;
            box-shadow: 0 0 15px #f59e0b;
        }

        /* 모달 스타일 */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.6);
            z-index: 200;
            display: flex;
            align-items: center;
            justify-content: center;
            backdrop-filter: blur(4px);
            animation: fadeIn 0.3s ease;
        }

        .modal-overlay.hidden {
            display: none;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .modal-box {
            background: #fff;
            border-radius: 24px;
            padding: 2rem 2.5rem;
            max-width: 480px;
            width: 90%;
            text-align: center;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            border: 4px solid #fbbf24;
            animation: popIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        @keyframes popIn {
            from { transform: scale(0.7); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }

        .rule-item {
            background: #f0fdf4;
            border-left: 4px solid #22c55e;
            border-radius: 8px;
            padding: 0.5rem 0.8rem;
            margin: 0.4rem 0;
            text-align: left;
            font-size: 0.95rem;
            color: #166534;
        }

        .start-btn {
            background: linear-gradient(135deg, #f97316, #ef4444);
            color: white;
            font-size: 1.4rem;
            font-family: 'Jua', sans-serif;
            padding: 0.8rem 2.5rem;
            border-radius: 999px;
            border: none;
            cursor: pointer;
            margin-top: 1.2rem;
            box-shadow: 0 6px 0 #b91c1c;
            transition: all 0.15s;
        }

        .start-btn:active {
            transform: translateY(4px);
            box-shadow: 0 2px 0 #b91c1c;
        }
    </style>
</head>
<body class="p-4 flex flex-col items-center justify-center min-h-screen">

    <!-- 게임 시작 모달 -->
    <div id="startModal" class="modal-overlay">
        <div class="modal-box">
            <div class="text-5xl mb-2">🐥🐔</div>
            <h2 class="text-3xl font-bold text-orange-500 mb-1">치킨차차!</h2>
            <p class="text-green-700 text-sm mb-4">기억력 메모리 레이싱 게임</p>

            <div class="mb-4">
                <p class="text-base font-bold text-gray-700 mb-2">🎮 게임 방법</p>
                <div class="rule-item">1️⃣ 내 닭 앞 트랙 칸의 그림을 기억하세요!</div>
                <div class="rule-item">2️⃣ 가운데 마당에서 같은 그림 카드를 찾아 뒤집으세요.</div>
                <div class="rule-item">3️⃣ 맞으면 한 칸 전진! 틀리면 상대 차례로 넘어가요.</div>
                <div class="rule-item">4️⃣ 상대 닭을 밟으면 꽁지깃을 뺏어요!</div>
                <div class="rule-item">5️⃣ 꽁지깃을 모두 모으면 승리! 🏆</div>
            </div>

            <button class="start-btn" onclick="startGame()">
                🐥 게임 시작!
            </button>
        </div>
    </div>

    <div class="text-center mb-4">
        <h1 class="text-4xl font-bold text-green-800 mb-2">🐥 치킨차차 🐥</h1>
        <div id="status" class="text-xl text-green-700 bg-white px-4 py-2 rounded-full shadow-sm border-2 border-green-200">
            게임을 시작합니다!
        </div>
    </div>

    <div class="game-container" id="gameBoard">
        <!-- 트랙 타일들이 여기에 생성됨 -->
        <!-- 마당 타일들이 여기에 생성됨 -->
        <div class="yard-container" id="yardContainer"></div>
    </div>

    <div class="mt-8 flex gap-4">
        <button onclick="showStartModal()" class="bg-orange-500 hover:bg-orange-600 text-white font-bold py-3 px-8 rounded-full shadow-lg transition transform active:scale-95">
            게임 재시작
        </button>
    </div>

    <div id="messageBox" class="message-box">메시지</div>

    <script>
        const SYMBOLS = ['🍎', '🍌', '🍇', '🍓', '🍒', '🍍', '🥝', '🍉', '🥕', '🌽', '🥦', '🍄'];
        const TRACK_COUNT = 24;
        const YARD_COUNT = 12;
        
        let gameState = {
            track: [],
            yard: [],
            players: [
                { id: 0, pos: 0, feathers: 1, color: '🐔', name: '빨강 닭' },
                { id: 1, pos: 12, feathers: 1, color: '🐤', name: '노랑 닭' }
            ],
            currentPlayer: 0,
            isProcessing: false
        };

        function showMessage(msg) {
            const box = document.getElementById('messageBox');
            box.innerText = msg;
            box.classList.add('show');
            setTimeout(() => box.classList.remove('show'), 2000);
        }

        function shuffle(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
            return array;
        }

        function initGame() {
            gameState.isProcessing = false;
            gameState.currentPlayer = 0;
            gameState.players = [
                { id: 0, pos: 0, feathers: 1, color: '🐔', name: '빨강 닭' },
                { id: 1, pos: 12, feathers: 1, color: '🐤', name: '노랑 닭' }
            ];

            // 트랙 생성 (12개 심볼 각 2개씩)
            const trackSymbols = shuffle([...SYMBOLS, ...SYMBOLS]);
            gameState.track = trackSymbols;

            // 마당 생성 (12개 심볼 각 1개씩)
            const yardSymbols = shuffle([...SYMBOLS]);
            gameState.yard = yardSymbols;

            renderBoard();
            updateStatus();
        }

        function renderBoard() {
            const board = document.getElementById('gameBoard');
            const yardContainer = document.getElementById('yardContainer');
            
            // 기존 요소 삭제 (마당 컨테이너 제외)
            const children = Array.from(board.children);
            children.forEach(child => {
                if (child.id !== 'yardContainer') board.removeChild(child);
            });
            yardContainer.innerHTML = '';

            // 트랙 타일 배치 (원형)
            const radius = 42; // % 단위
            for (let i = 0; i < TRACK_COUNT; i++) {
                const angle = (i / TRACK_COUNT) * (2 * Math.PI) - (Math.PI / 2);
                const x = 50 + radius * Math.cos(angle);
                const y = 50 + radius * Math.sin(angle);
                
                const tile = document.createElement('div');
                tile.className = 'track-tile';
                tile.id = `track-${i}`;
                tile.style.left = `${x}%`;
                tile.style.top = `${y}%`;
                tile.style.transform = `translate(-50%, -50%) rotate(${angle + Math.PI/2}rad)`;
                tile.innerText = gameState.track[i];
                board.appendChild(tile);
            }

            // 마당 타일 배치
            gameState.yard.forEach((symbol, index) => {
                const tile = document.createElement('div');
                tile.className = 'yard-tile';
                tile.dataset.symbol = symbol;
                tile.dataset.index = index;
                tile.innerHTML = '?';
                tile.onclick = () => handleYardClick(index);
                yardContainer.appendChild(tile);
            });

            // 플레이어 말 배치
            gameState.players.forEach(player => {
                const chicken = document.createElement('div');
                chicken.className = 'chicken';
                chicken.id = `chicken-${player.id}`;
                
                const body = document.createElement('div');
                body.className = 'chicken-body';
                body.innerHTML = player.color;
                
                const fCount = document.createElement('div');
                fCount.className = 'feathers-count';
                fCount.id = `feathers-${player.id}`;
                fCount.innerText = player.feathers;
                
                chicken.appendChild(body);
                chicken.appendChild(fCount);
                board.appendChild(chicken);
                
                updateChickenPosition(player.id);
            });
        }

        function updateChickenPosition(playerId) {
            const player = gameState.players.find(p => p.id === playerId);
            const chicken = document.getElementById(`chicken-${playerId}`);
            const trackTile = document.getElementById(`track-${player.pos}`);
            
            chicken.style.left = trackTile.style.left;
            chicken.style.top = trackTile.style.top;
            
            // 현재 턴인 경우 애니메이션 효과
            if (gameState.currentPlayer === playerId) {
                chicken.classList.add('active-turn');
                document.getElementById(`track-${player.pos}`).classList.add('highlight-tile');
            } else {
                chicken.classList.remove('active-turn');
                document.getElementById(`track-${player.pos}`).classList.remove('highlight-tile');
            }

            document.getElementById(`feathers-${playerId}`).innerText = player.feathers;
        }

        function handleYardClick(index) {
            if (gameState.isProcessing) return;
            
            const player = gameState.players[gameState.currentPlayer];
            const nextPos = (player.pos + 1) % TRACK_COUNT;
            const targetSymbol = gameState.track[nextPos];
            const selectedSymbol = gameState.yard[index];
            
            const tiles = document.querySelectorAll('.yard-tile');
            const clickedTile = tiles[index];
            
            gameState.isProcessing = true;
            clickedTile.innerHTML = selectedSymbol;
            clickedTile.classList.add('flipped');

            setTimeout(() => {
                if (selectedSymbol === targetSymbol) {
                    // 성공! 한 칸 전진
                    movePlayer(player.id);
                    showMessage('정답입니다! 한 번 더!');
                    
                    // 전진 후 승리 체크
                    if (checkWin()) {
                        endGame();
                    } else {
                        gameState.isProcessing = false;
                        updateStatus();
                        // 성공 시 카드는 다시 물음표로 돌아가지만, 성공했으므로 턴 유지
                        setTimeout(() => {
                            clickedTile.innerHTML = '?';
                            clickedTile.classList.remove('flipped');
                        }, 500);
                    }
                } else {
                    // 실패! 턴 넘기기
                    showMessage('틀렸습니다! 다음 차례...');
                    setTimeout(() => {
                        clickedTile.innerHTML = '?';
                        clickedTile.classList.remove('flipped');
                        nextTurn();
                    }, 1000);
                }
            }, 600);
        }

        function movePlayer(playerId) {
            const player = gameState.players.find(p => p.id === playerId);
            const opponent = gameState.players.find(p => p.id !== playerId);
            
            // 기존 위치 하이라이트 제거
            document.getElementById(`track-${player.pos}`).classList.remove('highlight-tile');

            let nextPos = (player.pos + 1) % TRACK_COUNT;

            // 만약 앞에 다른 플레이어가 있다면 뛰어넘고 깃털 빼앗기
            if (nextPos === opponent.pos) {
                player.feathers += opponent.feathers;
                opponent.feathers = 0;
                nextPos = (nextPos + 1) % TRACK_COUNT;
                showMessage('상대의 꽁지깃을 뺏었습니다!');
            }

            player.pos = nextPos;
            updateChickenPosition(player.id);
        }

        function nextTurn() {
            // 하이라이트 정리
            gameState.players.forEach(p => {
                document.getElementById(`track-${p.pos}`).classList.remove('highlight-tile');
            });

            gameState.currentPlayer = (gameState.currentPlayer + 1) % gameState.players.length;
            gameState.isProcessing = false;
            updateStatus();
            updateChickenPosition(gameState.currentPlayer);
        }

        function updateStatus() {
            const status = document.getElementById('status');
            const player = gameState.players[gameState.currentPlayer];
            status.innerText = `${player.name}(${player.color})의 차례! 앞의 타일을 찾으세요.`;
            status.style.borderColor = (gameState.currentPlayer === 0) ? '#f87171' : '#fbbf24';
        }

        function checkWin() {
            // 모든 깃털(총 2개)을 다 모았는지 체크
            const totalFeathers = gameState.players.reduce((acc, p) => acc + p.feathers, 0);
            const winner = gameState.players.find(p => p.feathers === totalFeathers);
            return winner;
        }

        function endGame() {
            const winner = gameState.players.find(p => p.feathers > 0 && gameState.players.every(op => op.id === p.id || op.feathers === 0));
            const status = document.getElementById('status');
            status.innerText = `🎉 게임 종료! ${winner.name} 승리! 🎉`;
            status.classList.add('bg-yellow-100', 'scale-110');
            gameState.isProcessing = true;
            
            // 폭죽 효과 대신 간단한 메시지
            showMessage(`${winner.name}가 모든 깃털을 모았습니다!`);
        }

        function showStartModal() {
            document.getElementById('startModal').classList.remove('hidden');
        }

        function startGame() {
            document.getElementById('startModal').classList.add('hidden');
            initGame();
        }

        window.onload = () => {
            // 보드를 빈 상태로 먼저 렌더링 (배경 보이도록)
            document.getElementById('startModal').classList.remove('hidden');
        };
    </script>
</body>
</html>
