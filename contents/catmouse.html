<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>고양이와 쥐 게임</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #f0fdf4;
            font-family: 'Pretendard', sans-serif;
            touch-action: none;
        }
        canvas {
            display: block;
            background-color: #ffffff;
            box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1);
            cursor: none;
        }
        .ui-overlay {
            pointer-events: none;
            user-select: none;
        }
    </style>
</head>
<body class="flex flex-col items-center justify-center min-h-screen">

    <!-- 상단 UI -->
    <div class="absolute top-4 left-0 right-0 flex justify-between px-6 ui-overlay z-10">
        <div class="bg-white/80 backdrop-blur-md p-3 rounded-2xl shadow-lg border border-orange-100">
            <p class="text-lg font-bold text-orange-600">점수: <span id="score">0</span></p>
        </div>
        <div class="bg-white/80 backdrop-blur-md p-3 rounded-2xl shadow-lg border border-blue-100 text-center">
            <p class="text-sm text-gray-500 font-medium">조작: 마우스/터치</p>
        </div>
    </div>

    <!-- 캔버스 컨테이너 -->
    <div id="game-container" class="relative w-full h-full flex items-center justify-center">
        <canvas id="gameCanvas"></canvas>
    </div>

    <!-- 게임 오버/시작 화면 -->
    <div id="overlay" class="absolute inset-0 bg-black/40 backdrop-blur-sm flex items-center justify-center z-20 transition-opacity duration-300">
        <div class="bg-white p-8 rounded-3xl shadow-2xl text-center max-w-sm mx-4">
            <h1 id="overlay-title" class="text-3xl font-black text-gray-800 mb-2">고양이와 쥐</h1>
            <p id="overlay-msg" class="text-gray-600 mb-6 font-medium">쥐를 쫓아 점수를 얻으세요!</p>
            <button id="start-btn" class="w-full bg-orange-500 hover:bg-orange-600 text-white font-bold py-4 rounded-xl shadow-lg transition-transform active:scale-95 text-lg">
                게임 시작
            </button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const scoreEl = document.getElementById('score');
        const overlay = document.getElementById('overlay');
        const overlayTitle = document.getElementById('overlay-title');
        const overlayMsg = document.getElementById('overlay-msg');
        const startBtn = document.getElementById('start-btn');

        // 게임 상태
        let score = 0;
        let isGameRunning = false;
        let animationId;
        const particles = [];

        // 캐릭터 데이터
        const cat = {
            x: 0,
            y: 0,
            size: 60,
            emoji: '🐱',
            targetX: 0,
            targetY: 0,
            speed: 0.15 // 부드러운 따라오기 계수
        };

        let mice = [];

        // 초기화 및 리사이즈
        function resize() {
            canvas.width = window.innerWidth * 0.95;
            canvas.height = window.innerHeight * 0.85;
            if (!isGameRunning) {
                cat.x = canvas.width / 2;
                cat.y = canvas.height / 2;
                cat.targetX = cat.x;
                cat.targetY = cat.y;
            }
        }

        window.addEventListener('resize', resize);
        resize();

        // 입력 제어
        function updateTarget(e) {
            const rect = canvas.getBoundingClientRect();
            let clientX, clientY;
            
            if (e.touches) {
                clientX = e.touches[0].clientX;
                clientY = e.touches[0].clientY;
            } else {
                clientX = e.clientX;
                clientY = e.clientY;
            }
            
            cat.targetX = clientX - rect.left;
            cat.targetY = clientY - rect.top;
        }

        canvas.addEventListener('mousemove', updateTarget);
        canvas.addEventListener('touchmove', (e) => {
            e.preventDefault();
            updateTarget(e);
        }, { passive: false });

        // 쥐 생성 클래스
        class Mouse {
            constructor() {
                this.reset();
            }

            reset() {
                this.size = 40;
                this.emoji = '🐭';
                // 화면 가장자리에서 생성
                const side = Math.floor(Math.random() * 4);
                if (side === 0) { // 상
                    this.x = Math.random() * canvas.width;
                    this.y = -this.size;
                } else if (side === 1) { // 하
                    this.x = Math.random() * canvas.width;
                    this.y = canvas.height + this.size;
                } else if (side === 2) { // 좌
                    this.x = -this.size;
                    this.y = Math.random() * canvas.height;
                } else { // 우
                    this.x = canvas.width + this.size;
                    this.y = Math.random() * canvas.height;
                }

                this.speed = 2 + Math.random() * 2;
                this.angle = Math.random() * Math.PI * 2;
                this.turnSpeed = (Math.random() - 0.5) * 0.1;
            }

            update() {
                // 고양이 피하기 인공지능 (고양이가 가까우면 반대 방향으로)
                const dx = cat.x - this.x;
                const dy = cat.y - this.y;
                const dist = Math.sqrt(dx*dx + dy*dy);

                if (dist < 200) {
                    const targetAngle = Math.atan2(dy, dx) + Math.PI;
                    const diff = targetAngle - this.angle;
                    this.angle += Math.sin(diff) * 0.1;
                } else {
                    this.angle += this.turnSpeed;
                    if (Math.random() < 0.02) this.turnSpeed = (Math.random() - 0.5) * 0.1;
                }

                this.x += Math.cos(this.angle) * this.speed;
                this.y += Math.sin(this.angle) * this.speed;

                // 벽 충돌 처리 (튕기기)
                if (this.x < 0 || this.x > canvas.width) {
                    this.angle = Math.PI - this.angle;
                    this.x = Math.max(0, Math.min(this.x, canvas.width));
                }
                if (this.y < 0 || this.y > canvas.height) {
                    this.angle = -this.angle;
                    this.y = Math.max(0, Math.min(this.y, canvas.height));
                }
            }

            draw() {
                ctx.save();
                ctx.translate(this.x, this.y);
                // 이동 방향에 맞춰 회전 (이모지 방향 보정)
                ctx.rotate(this.angle + Math.PI / 2);
                ctx.font = `${this.size}px serif`;
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText(this.emoji, 0, 0);
                ctx.restore();
            }
        }

        // 효과용 파티클
        class Particle {
            constructor(x, y) {
                this.x = x;
                this.y = y;
                this.vx = (Math.random() - 0.5) * 10;
                this.vy = (Math.random() - 0.5) * 10;
                this.alpha = 1;
                this.color = `hsl(${Math.random() * 360}, 70%, 70%)`;
            }
            update() {
                this.x += this.vx;
                this.y += this.vy;
                this.alpha -= 0.02;
            }
            draw() {
                ctx.save();
                ctx.globalAlpha = this.alpha;
                ctx.fillStyle = this.color;
                ctx.beginPath();
                ctx.arc(this.x, this.y, 4, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            }
        }

        function createExplosion(x, y) {
            for (let i = 0; i < 15; i++) {
                particles.push(new Particle(x, y));
            }
        }

        function gameLoop() {
            if (!isGameRunning) return;

            // 배경 지우기
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // 고양이 위치 업데이트 (부드럽게 이동)
            cat.x += (cat.targetX - cat.x) * cat.speed;
            cat.y += (cat.targetY - cat.y) * cat.speed;

            // 파티클 업데이트
            for (let i = particles.length - 1; i >= 0; i--) {
                particles[i].update();
                particles[i].draw();
                if (particles[i].alpha <= 0) particles.splice(i, 1);
            }

            // 쥐 업데이트 및 그리기
            mice.forEach((mouse, index) => {
                mouse.update();
                mouse.draw();

                // 충돌 검사
                const dx = cat.x - mouse.x;
                const dy = cat.y - mouse.y;
                const dist = Math.sqrt(dx*dx + dy*dy);

                if (dist < (cat.size + mouse.size) / 2.5) {
                    // 쥐를 잡음!
                    createExplosion(mouse.x, mouse.y);
                    mouse.reset();
                    score += 10;
                    scoreEl.innerText = score;

                    // 점수에 따라 쥐 추가
                    if (score % 50 === 0) {
                        mice.push(new Mouse());
                    }
                }
            });

            // 고양이 그리기
            ctx.save();
            ctx.font = `${cat.size}px serif`;
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            // 고양이가 마우스를 바라보도록 살짝 기울기 효과
            const angle = Math.atan2(cat.targetY - cat.y, cat.targetX - cat.x);
            ctx.translate(cat.x, cat.y);
            ctx.rotate(angle + Math.PI / 2);
            ctx.fillText(cat.emoji, 0, 0);
            ctx.restore();

            animationId = requestAnimationFrame(gameLoop);
        }

        function startGame() {
            score = 0;
            scoreEl.innerText = score;
            mice = [new Mouse(), new Mouse(), new Mouse()];
            isGameRunning = true;
            overlay.style.opacity = '0';
            setTimeout(() => overlay.classList.add('hidden'), 300);
            gameLoop();
        }

        startBtn.addEventListener('click', startGame);

        // 초기 화면 설정
        cat.x = canvas.width / 2;
        cat.y = canvas.height / 2;
    </script>
</body>
</html>
