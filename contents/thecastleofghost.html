<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Haunted Castle Escape</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Creepster&display=swap');
        
        body {
            margin: 0;
            overflow: hidden;
            background-color: #0a0a0a;
            touch-action: none;
            font-family: 'sans-serif';
        }

        #game-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        canvas {
            display: block;
            background: linear-gradient(to bottom, #1a1a2e 0%, #16213e 100%);
            border: 4px solid #4e4e6a;
            border-radius: 12px;
            box-shadow: 0 0 30px rgba(0, 0, 0, 0.8), 0 0 15px rgba(100, 100, 255, 0.2);
            max-width: 100%;
            max-height: 80vh;
        }

        .spooky-font {
            font-family: 'Creepster', system-ui;
        }

        .ui-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .btn {
            pointer-events: auto;
            transition: all 0.2s;
            cursor: pointer;
        }

        .btn:active {
            transform: scale(0.95);
        }

        #controls {
            position: absolute;
            bottom: 20px;
            width: 100%;
            display: flex;
            justify-content: space-around;
            padding: 0 20px;
            pointer-events: none;
        }

        .ctrl-btn {
            width: 70px;
            height: 70px;
            background: rgba(255, 255, 255, 0.1);
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 24px;
            pointer-events: auto;
            user-select: none;
        }
    </style>
</head>
<body>

<div id="game-container">
    <div id="score-board" class="absolute top-4 left-4 text-white text-2xl z-10 spooky-font tracking-widest">
        SOULS SAVED: <span id="score">0</span>
    </div>

    <canvas id="gameCanvas"></canvas>

    <!-- UI Overlays -->
    <div id="start-screen" class="ui-overlay bg-black/70">
        <h1 class="text-6xl text-purple-600 spooky-font mb-8 drop-shadow-lg">HAUNTED CASTLE</h1>
        <p class="text-gray-300 mb-6 text-center px-4">유령들을 피해 최대한 오래 살아남으세요!<br>(방향키 또는 하단 버튼 사용)</p>
        <button id="start-btn" class="btn px-8 py-3 bg-purple-700 hover:bg-purple-600 text-white rounded-full text-xl font-bold shadow-xl">
            게임 시작
        </button>
    </div>

    <div id="game-over-screen" class="ui-overlay bg-red-900/40 hidden">
        <h2 class="text-6xl text-red-600 spooky-font mb-4">CAUGHT BY GHOSTS</h2>
        <p class="text-2xl text-white mb-8">FINAL SCORE: <span id="final-score">0</span></p>
        <button id="restart-btn" class="btn px-8 py-3 bg-white text-red-900 rounded-full text-xl font-bold shadow-xl">
            다시 도전
        </button>
    </div>

    <!-- Mobile Controls -->
    <div id="controls" class="md:hidden">
        <div id="left-btn" class="ctrl-btn">◀</div>
        <div id="right-btn" class="ctrl-btn">▶</div>
    </div>
</div>

<script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const scoreElement = document.getElementById('score');
    const finalScoreElement = document.getElementById('final-score');
    const startScreen = document.getElementById('start-screen');
    const gameOverScreen = document.getElementById('game-over-screen');
    const startBtn = document.getElementById('start-btn');
    const restartBtn = document.getElementById('restart-btn');

    // 게임 상태
    let gameState = 'START'; // START, PLAYING, GAMEOVER
    let score = 0;
    let animationId;
    let lastTime = 0;
    let spawnTimer = 0;
    let difficultyMultiplier = 1;

    // 설정
    const CANVAS_WIDTH = 400;
    const CANVAS_HEIGHT = 600;
    canvas.width = CANVAS_WIDTH;
    canvas.height = CANVAS_HEIGHT;

    // 플레이어
    const player = {
        x: CANVAS_WIDTH / 2 - 20,
        y: CANVAS_HEIGHT - 80,
        w: 40,
        h: 40,
        speed: 5,
        dx: 0,
        emoji: '🏃'
    };

    // 적 (유령)
    let ghosts = [];
    const ghostEmojis = ['👻', '💀', '👽', '🎃'];

    // 입력 처리
    const keys = {};
    window.addEventListener('keydown', e => keys[e.code] = true);
    window.addEventListener('keyup', e => keys[e.code] = false);

    // 터치 입력
    const leftBtn = document.getElementById('left-btn');
    const rightBtn = document.getElementById('right-btn');
    
    let leftPressed = false;
    let rightPressed = false;

    leftBtn.addEventListener('touchstart', (e) => { e.preventDefault(); leftPressed = true; });
    leftBtn.addEventListener('touchend', () => leftPressed = false);
    rightBtn.addEventListener('touchstart', (e) => { e.preventDefault(); rightPressed = true; });
    rightBtn.addEventListener('touchend', () => rightPressed = false);

    function resetGame() {
        score = 0;
        scoreElement.innerText = score;
        ghosts = [];
        player.x = CANVAS_WIDTH / 2 - 20;
        difficultyMultiplier = 1;
        spawnTimer = 0;
        gameState = 'PLAYING';
        startScreen.classList.add('hidden');
        gameOverScreen.classList.add('hidden');
    }

    function spawnGhost() {
        const size = 30 + Math.random() * 20;
        const x = Math.random() * (CANVAS_WIDTH - size);
        const emoji = ghostEmojis[Math.floor(Math.random() * ghostEmojis.length)];
        const speed = (2 + Math.random() * 3) * difficultyMultiplier;

        ghosts.push({
            x, y: -size, w: size, h: size, speed, emoji
        });
    }

    function update(deltaTime) {
        if (gameState !== 'PLAYING') return;

        // 난이도 상승
        difficultyMultiplier += 0.0001 * deltaTime;

        // 플레이어 이동
        if (keys['ArrowLeft'] || leftPressed) player.dx = -player.speed;
        else if (keys['ArrowRight'] || rightPressed) player.dx = player.speed;
        else player.dx = 0;

        player.x += player.dx;
        
        // 벽 충돌
        if (player.x < 0) player.x = 0;
        if (player.x + player.w > CANVAS_WIDTH) player.x = CANVAS_WIDTH - player.w;

        // 유령 생성 타이머
        spawnTimer += deltaTime;
        if (spawnTimer > 1000 / difficultyMultiplier) {
            spawnGhost();
            spawnTimer = 0;
        }

        // 유령 업데이트
        for (let i = ghosts.length - 1; i >= 0; i--) {
            const g = ghosts[i];
            g.y += g.speed;

            // 충돌 감지
            if (
                player.x < g.x + g.w - 10 &&
                player.x + player.w > g.x + 10 &&
                player.y < g.y + g.h - 10 &&
                player.y + player.h > g.y + 10
            ) {
                endGame();
            }

            // 화면 밖 제거 및 점수 획득
            if (g.y > CANVAS_HEIGHT) {
                ghosts.splice(i, 1);
                score++;
                scoreElement.innerText = score;
            }
        }
    }

    function draw() {
        ctx.clearRect(0, 0, CANVAS_WIDTH, CANVAS_HEIGHT);

        // 배경 효과 (안개 느낌)
        const gradient = ctx.createRadialGradient(
            CANVAS_WIDTH/2, CANVAS_HEIGHT/2, 50, 
            CANVAS_WIDTH/2, CANVAS_HEIGHT/2, 400
        );
        gradient.addColorStop(0, 'rgba(30, 30, 60, 0.2)');
        gradient.addColorStop(1, 'rgba(0, 0, 0, 0.5)');
        ctx.fillStyle = gradient;
        ctx.fillRect(0, 0, CANVAS_WIDTH, CANVAS_HEIGHT);

        // 플레이어 그리기
        ctx.font = `${player.w}px Arial`;
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(player.emoji, player.x + player.w/2, player.y + player.h/2);

        // 유령들 그리기
        ghosts.forEach(g => {
            ctx.font = `${g.w}px Arial`;
            // 유령 글로우 효과
            ctx.shadowBlur = 10;
            ctx.shadowColor = 'rgba(255, 255, 255, 0.3)';
            ctx.fillText(g.emoji, g.x + g.w/2, g.y + g.h/2);
            ctx.shadowBlur = 0;
        });
    }

    function gameLoop(timestamp) {
        const deltaTime = timestamp - lastTime;
        lastTime = timestamp;

        update(deltaTime);
        draw();

        animationId = requestAnimationFrame(gameLoop);
    }

    function endGame() {
        gameState = 'GAMEOVER';
        finalScoreElement.innerText = score;
        gameOverScreen.classList.remove('hidden');
    }

    startBtn.addEventListener('click', resetGame);
    restartBtn.addEventListener('click', resetGame);

    window.onload = () => {
        requestAnimationFrame(gameLoop);
    };

    // 창 크기 대응
    function resizeCanvas() {
        const container = document.getElementById('game-container');
        const ratio = CANVAS_WIDTH / CANVAS_HEIGHT;
        let newWidth = window.innerWidth * 0.9;
        let newHeight = newWidth / ratio;

        if (newHeight > window.innerHeight * 0.7) {
            newHeight = window.innerHeight * 0.7;
            newWidth = newHeight * ratio;
        }

        canvas.style.width = `${newWidth}px`;
        canvas.style.height = `${newHeight}px`;
    }

    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

</script>
</body>
</html>
