<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>징고(Zingo) 게임</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Jua&display=swap');

        body {
            font-family: 'Jua', sans-serif;
            background-color: #f0f9ff;
            user-select: none;
        }

        .zingo-card {
            perspective: 1000px;
        }

        .tile-animation {
            animation: slideDown 0.5s ease-out forwards;
        }

        @keyframes slideDown {
            0% { transform: translateY(-50px) scale(0.5); opacity: 0; }
            100% { transform: translateY(0) scale(1); opacity: 1; }
        }

        .matched {
            background-color: #4ade80 !important;
            transform: scale(0.95);
            transition: all 0.3s ease;
        }

        .zinger-machine {
            background: linear-gradient(135deg, #ef4444 0%, #b91c1c 100%);
            box-shadow: 0 10px 20px rgba(0,0,0,0.2);
        }

        .slot {
            background: #7f1d1d;
            box-shadow: inset 0 4px 6px rgba(0,0,0,0.3);
        }

        /* 시작 모달 */
        .start-modal {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.72);
            z-index: 200;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1rem;
            backdrop-filter: blur(4px);
        }
        .start-modal.hidden { display: none; }
        .start-modal-box {
            background: #fff;
            border-radius: 24px;
            width: 100%;
            max-width: 420px;
            overflow: hidden;
            border: 4px solid #ef4444;
            box-shadow: 0 25px 60px rgba(0,0,0,0.35);
            animation: popIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        @keyframes popIn {
            from { transform: scale(0.7); opacity: 0; }
            to   { transform: scale(1);   opacity: 1; }
        }
        .zingo-header {
            background: linear-gradient(135deg, #ef4444, #b91c1c);
            padding: 1.6rem;
            text-align: center;
        }
        .rule-item {
            background: #fff1f2;
            border-left: 4px solid #ef4444;
            border-radius: 8px;
            padding: 0.5rem 0.8rem;
            margin: 0.35rem 0;
            font-size: 0.9rem;
            color: #9f1239;
            font-weight: 600;
        }
        .zingo-start-btn {
            width: 100%;
            background: linear-gradient(135deg, #ef4444, #b91c1c);
            color: white;
            font-size: 1.3rem;
            font-weight: 900;
            padding: 0.9rem;
            border: none;
            border-radius: 14px;
            cursor: pointer;
            box-shadow: 0 5px 0 #7f1d1d;
            transition: all 0.15s;
            font-family: 'Jua', sans-serif;
        }
        .zingo-start-btn:active {
            transform: translateY(4px);
            box-shadow: 0 1px 0 #7f1d1d;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center p-4">

    <!-- 게임 시작 모달 -->
    <div id="startModal" class="start-modal">
        <div class="start-modal-box">
            <div class="zingo-header">
                <div style="font-size:3rem;margin-bottom:0.3rem;">🔤</div>
                <h2 style="font-size:2.2rem;font-weight:900;color:white;margin:0;">ZINGO!</h2>
                <p style="color:rgba(255,255,255,0.85);font-size:0.82rem;margin-top:4px;">5세 이상 · 2명 · 순발력 어휘 매칭 게임</p>
            </div>
            <div style="padding:1.2rem 1.5rem;">
                <p style="font-size:0.72rem;font-weight:900;color:#b91c1c;text-transform:uppercase;letter-spacing:0.1em;text-align:center;margin-bottom:0.8rem;">게임 방법</p>
                <div class="rule-item">1️⃣ 플레이어 1, 2 각각 9칸 보드를 받습니다.</div>
                <div class="rule-item">2️⃣ 징! 버튼을 눌러 징거 머신에서 타일 2개를 꺼냅니다.</div>
                <div class="rule-item">3️⃣ 내 보드에 나온 그림·단어가 있으면 빠르게 클릭!</div>
                <div class="rule-item">4️⃣ 타일을 가져가 보드 칸을 채웁니다.</div>
                <div class="rule-item">5️⃣ 보드 9칸을 먼저 채우면 ZINGO! 승리 🏆</div>
            </div>
            <div style="padding:0 1.5rem 1.5rem;">
                <button class="zingo-start-btn" onclick="startGame()">🔤 게임 시작!</button>
            </div>
        </div>
    </div>

    <!-- 헤더 -->
    <header class="text-center mb-6">
        <h1 class="text-5xl text-red-600 drop-shadow-md mb-2">ZINGO!</h1>
        <p class="text-gray-600">타일을 맞춰 보드를 먼저 완성하세요!</p>
    </header>

    <!-- 게임 컨트롤 / 징거 머신 -->
    <div class="w-full max-w-2xl mb-8">
        <div class="zinger-machine rounded-3xl p-6 flex flex-col items-center">
            <div class="flex justify-around w-full mb-4">
                <!-- 타일 슬롯 1 -->
                <div id="slot-0" class="slot w-24 h-24 rounded-xl flex items-center justify-center border-4 border-yellow-400 overflow-hidden">
                    <span class="text-gray-400 text-sm">준비</span>
                </div>
                <!-- 타일 슬롯 2 -->
                <div id="slot-1" class="slot w-24 h-24 rounded-xl flex items-center justify-center border-4 border-yellow-400 overflow-hidden">
                    <span class="text-gray-400 text-sm">준비</span>
                </div>
            </div>
            
            <button id="zing-btn" class="bg-yellow-400 hover:bg-yellow-300 text-red-800 text-2xl px-12 py-3 rounded-full shadow-lg transform active:scale-95 transition-all duration-150 border-b-4 border-yellow-600">
                징! (ZING!)
            </button>
        </div>
    </div>

    <!-- 플레이어 보드 영역 -->
    <div class="grid grid-cols-1 md:grid-cols-2 gap-8 w-full max-w-5xl">
        <!-- 플레이어 1 -->
        <div class="bg-white p-4 rounded-2xl shadow-xl border-t-8 border-blue-500">
            <h2 class="text-2xl text-blue-600 mb-4 text-center">플레이어 1</h2>
            <div id="board-0" class="grid grid-cols-3 gap-2"></div>
            <div class="mt-4 bg-gray-100 rounded-full h-4 overflow-hidden">
                <div id="progress-0" class="bg-blue-500 h-full transition-all duration-500" style="width: 0%"></div>
            </div>
        </div>

        <!-- 플레이어 2 -->
        <div class="bg-white p-4 rounded-2xl shadow-xl border-t-8 border-green-500">
            <h2 class="text-2xl text-green-600 mb-4 text-center">플레이어 2</h2>
            <div id="board-1" class="grid grid-cols-3 gap-2"></div>
            <div class="mt-4 bg-gray-100 rounded-full h-4 overflow-hidden">
                <div id="progress-1" class="bg-green-500 h-full transition-all duration-500" style="width: 0%"></div>
            </div>
        </div>
    </div>

    <!-- 우승 모달 -->
    <div id="win-modal" class="fixed inset-0 bg-black/70 flex items-center justify-center z-50 hidden p-4">
        <div class="bg-white rounded-3xl p-8 max-w-sm w-full text-center">
            <div class="text-6xl mb-4">🏆</div>
            <h2 id="winner-text" class="text-3xl text-red-600 mb-6">축하합니다!</h2>
            <button onclick="resetGame()" class="w-full bg-red-500 text-white py-3 rounded-xl text-xl hover:bg-red-600">다시 하기</button>
        </div>
    </div>

    <script>
        // 게임 데이터 (이모지 및 이름)
        const items = [
            { id: 1, name: '사과', emoji: '🍎' },
            { id: 2, name: '태양', emoji: '☀️' },
            { id: 3, name: '별', emoji: '⭐' },
            { id: 4, name: '집', emoji: '🏠' },
            { id: 5, name: '고양이', emoji: '🐱' },
            { id: 6, name: '강아지', emoji: '🐶' },
            { id: 7, name: '새', emoji: '🐦' },
            { id: 8, name: '물고기', emoji: '🐟' },
            { id: 9, name: '꽃', emoji: '🌸' },
            { id: 10, name: '케이크', emoji: '🍰' },
            { id: 11, name: '공', emoji: '⚽' },
            { id: 12, name: '기차', emoji: '🚂' },
            { id: 13, name: '나무', emoji: '🌳' },
            { id: 14, name: '달', emoji: '🌙' },
            { id: 15, name: '구름', emoji: '☁️' },
            { id: 16, name: '우산', emoji: '☔' },
            { id: 17, name: '토끼', emoji: '🐰' },
            { id: 18, name: '안경', emoji: '👓' }
        ];

        let boards = [[], []];
        let activeTiles = [null, null];
        let gameActive = true;

        // 게임 초기화
        function initGame() {
            gameActive = true;
            boards = [[], []];
            activeTiles = [null, null];
            
            // 슬롯 비우기
            document.getElementById('slot-0').innerHTML = '<span class="text-gray-400 text-sm">준비</span>';
            document.getElementById('slot-1').innerHTML = '<span class="text-gray-400 text-sm">준비</span>';
            
            // 보드 생성 (9개 무작위 아이템)
            for (let p = 0; p < 2; p++) {
                const shuffled = [...items].sort(() => 0.5 - Math.random());
                boards[p] = shuffled.slice(0, 9).map(item => ({ ...item, matched: false }));
                renderBoard(p);
                updateProgress(p);
            }
        }

        // 보드 그리기
        function renderBoard(playerIdx) {
            const boardEl = document.getElementById(`board-${playerIdx}`);
            boardEl.innerHTML = '';
            
            boards[playerIdx].forEach((item, itemIdx) => {
                const div = document.createElement('div');
                div.className = `aspect-square rounded-xl border-2 flex flex-col items-center justify-center cursor-pointer transition-all ${item.matched ? 'matched border-green-600 shadow-inner' : 'bg-yellow-50 border-yellow-200 hover:border-yellow-400'}`;
                div.innerHTML = `
                    <span class="text-3xl mb-1">${item.emoji}</span>
                    <span class="text-xs text-gray-700">${item.name}</span>
                `;
                div.onclick = () => tryMatch(playerIdx, itemIdx);
                boardEl.appendChild(div);
            });
        }

        // 징거 버튼 클릭 (타일 뽑기)
        document.getElementById('zing-btn').onclick = function() {
            if (!gameActive) return;

            // 이미 슬롯에 타일이 있으면 무시 (실제 게임도 타일을 가져가야 다음이 나옴)
            if (activeTiles[0] || activeTiles[1]) {
                // 비어있는 슬롯만 채우는 방식으로 변경 가능하지만 여기서는 두 개 다 없어야 새로 뽑음
                // 또는 한 개라도 비어있으면 보충
            }

            // 무작위 2개 타일 선택 (보드에 있는 것 위주로 나올 확률 조정 가능하나 여기선 완전 랜덤)
            const randomItems = [...items].sort(() => 0.5 - Math.random()).slice(0, 2);
            activeTiles = randomItems;

            displayTiles();
        };

        function displayTiles() {
            [0, 1].forEach(idx => {
                const slot = document.getElementById(`slot-${idx}`);
                if (activeTiles[idx]) {
                    slot.innerHTML = `
                        <div class="bg-white w-full h-full flex flex-col items-center justify-center tile-animation">
                            <span class="text-4xl mb-1">${activeTiles[idx].emoji}</span>
                            <span class="text-sm font-bold text-red-600">${activeTiles[idx].name}</span>
                        </div>
                    `;
                } else {
                    slot.innerHTML = '<span class="text-gray-400 text-xs">비었음</span>';
                }
            });
        }

        // 타일 매칭 시도
        function tryMatch(playerIdx, itemIdx) {
            if (!gameActive) return;
            
            const boardItem = boards[playerIdx][itemIdx];
            if (boardItem.matched) return;

            // 현재 징거 슬롯에 해당 아이템이 있는지 확인
            const activeTileIdx = activeTiles.findIndex(t => t && t.id === boardItem.id);

            if (activeTileIdx !== -1) {
                // 매치 성공!
                boards[playerIdx][itemIdx].matched = true;
                activeTiles[activeTileIdx] = null; // 슬롯에서 제거
                
                displayTiles();
                renderBoard(playerIdx);
                updateProgress(playerIdx);
                checkWin(playerIdx);
            }
        }

        function updateProgress(playerIdx) {
            const matchedCount = boards[playerIdx].filter(i => i.matched).length;
            const percentage = (matchedCount / 9) * 100;
            document.getElementById(`progress-${playerIdx}`).style.width = percentage + '%';
        }

        function checkWin(playerIdx) {
            const allMatched = boards[playerIdx].every(i => i.matched);
            if (allMatched) {
                gameActive = false;
                const modal = document.getElementById('win-modal');
                const winText = document.getElementById('winner-text');
                winText.innerText = `플레이어 ${playerIdx + 1} 승리! ZINGO!`;
                modal.classList.remove('hidden');
            }
        }

        function resetGame() {
            document.getElementById('win-modal').classList.add('hidden');
            initGame();
        }

        function startGame() {
            document.getElementById('startModal').classList.add('hidden');
            initGame();
        }

        // 초기: 모달만 표시
        document.getElementById('startModal').classList.remove('hidden');

    </script>
</body>
</html>
