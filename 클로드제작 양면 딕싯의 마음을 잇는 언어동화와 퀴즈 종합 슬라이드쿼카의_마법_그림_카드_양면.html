<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>쿼카의 마법 그림 카드 · 양면 그림책</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Gowun+Dodum&display=swap" rel="stylesheet">
<style>
:root{
  --night:#1d2340;
  --paper:#fff9ec;
  --paper-2:#fbf0d6;
  --ink:#2f3350;
  --ink-soft:#5b5f7d;
  --gold:#f5c64f;
  --gold-deep:#d99e22;
  --coral:#f08a68;
  --sage:#6f9d72;
  --sage-deep:#4f7d55;
  --line:#e8dcc0;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  font-family:'Gowun Dodum',sans-serif;
  background:
    radial-gradient(1200px 600px at 80% -10%, #37406e 0%, transparent 60%),
    radial-gradient(900px 500px at 5% 110%, #33305c 0%, transparent 55%),
    var(--night);
  color:var(--ink);
  overflow:hidden;height:100dvh;
  display:flex;align-items:center;justify-content:center;
}
.serif{font-family:'Gowun Batang',serif}

/* 밤하늘 별 */
.sky{position:fixed;inset:0;pointer-events:none;z-index:0}
.sky i{position:absolute;border-radius:50%;background:#ffe9b0;opacity:.7;animation:twinkle 3.4s ease-in-out infinite}
@keyframes twinkle{0%,100%{opacity:.12;transform:scale(.7)}50%{opacity:.85;transform:scale(1)}}
@media (prefers-reduced-motion:reduce){.sky i,.float-star{animation:none!important}}

/* ── 고정 비율 스테이지 (1280×720): 화면에 맞춰 통째로 스케일 → 스크롤 없음 ── */
#stage{
  position:relative;z-index:2;
  width:1280px;height:720px;flex:0 0 auto;
  transform-origin:center center;
  display:flex;flex-direction:column;
}

/* 상단 바 */
header{
  height:52px;display:flex;align-items:center;justify-content:space-between;
  padding:0 26px;color:#f4ead0;
}
header .brand{font-size:17px;letter-spacing:.06em;display:flex;align-items:center;gap:9px}
.score-chip{
  display:none;align-items:center;gap:6px;font-size:15px;color:var(--night);
  background:var(--gold);border-radius:999px;padding:5px 15px;font-weight:700;
}
.score-chip.show{display:inline-flex}
header .count{font-size:15px;color:#c7bfa4;font-variant-numeric:tabular-nums}

/* 트랙 */
.deck{flex:1;min-height:0;position:relative;overflow:hidden}
.deck-track{height:100%;display:flex}
.slide{
  flex:0 0 100%;height:100%;
  display:flex;align-items:center;justify-content:center;
  padding:6px 20px 8px;
  transition:transform .45s cubic-bezier(.4,0,.2,1);
}

/* ── 양면 스프레드 카드 ─────────────────── */
.spread{
  width:100%;height:100%;
  display:grid;grid-template-columns:472px 1fr;
  background:linear-gradient(180deg,var(--paper) 0%,var(--paper-2) 100%);
  border-radius:24px;
  box-shadow:0 20px 55px rgba(8,10,30,.6), inset 0 0 0 1px rgba(255,255,255,.5);
  overflow:hidden;position:relative;
}
/* 책 등(중앙 접힘선) */
.spread::after{
  content:"";position:absolute;top:0;bottom:0;left:472px;width:26px;
  transform:translateX(-13px);
  background:linear-gradient(90deg,transparent, rgba(90,70,20,.14) 38%, rgba(60,45,10,.22) 50%, rgba(90,70,20,.14) 62%, transparent);
  pointer-events:none;
}

/* 왼쪽 · 회화 패널 (금박 액자) */
.plate{
  position:relative;padding:26px;
  background:
    radial-gradient(600px 400px at 30% 20%, #2f3763, transparent 70%),
    #232a4e;
  display:flex;
}
.frame{
  flex:1;position:relative;border-radius:8px;overflow:hidden;
  border:10px solid #caa24a;
  box-shadow:
    inset 0 0 0 3px #8a6a1f,
    inset 0 0 0 6px #e8c877,
    0 12px 30px rgba(0,0,0,.5);
  background:#1a1f3a;
}
.frame::after{ /* 유리 빛 */
  content:"";position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(115deg, rgba(255,255,255,.13) 0%, transparent 28%);
}
.frame svg{position:absolute;inset:0;width:100%;height:100%}
.caption{
  position:absolute;left:50%;bottom:8px;transform:translateX(-50%);
  background:#3a3157;color:#efe3c0;font-size:12.5px;letter-spacing:.1em;
  padding:5px 16px;border-radius:999px;border:1px solid #caa24a;white-space:nowrap;
}
.float-star{animation:floaty 5s ease-in-out infinite}
@keyframes floaty{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}

/* 오른쪽 · 내용 패널 */
.page{
  position:relative;padding:30px 34px 26px 40px;
  display:flex;flex-direction:column;gap:13px;min-width:0;
}
.eyebrow{
  display:inline-flex;align-items:center;gap:8px;
  font-size:13px;letter-spacing:.14em;color:var(--gold-deep);font-weight:700;
}
.eyebrow::before{content:"";width:24px;height:2px;background:var(--gold-deep);border-radius:2px}
h1{font-size:40px;line-height:1.3;color:var(--ink)}
h2{font-size:25px;line-height:1.4;color:var(--ink)}
p.lead{font-size:16.5px;line-height:1.95;color:var(--ink-soft)}
p.lead strong{color:var(--ink)}

/* 표지 */
.slide.cover .spread{background:linear-gradient(180deg,#232a4e,#1a1f3c)}
.slide.cover .page{justify-content:center;gap:18px;color:#f6efdb}
.slide.cover h1{color:#ffe9a8}
.slide.cover p.lead{color:#cfc8ad}
.badge{
  align-self:flex-start;font-size:13px;letter-spacing:.22em;color:var(--night);
  background:var(--gold);padding:7px 18px;border-radius:999px;font-weight:700;
}

/* 인물 3단 */
.trio{display:grid;grid-template-columns:1fr;gap:9px}
.trio .who{
  background:#fff;border:1px solid var(--line);border-radius:14px;
  padding:11px 14px;display:flex;gap:12px;align-items:center;text-align:left;
}
.trio .who svg{width:46px;height:46px;flex:0 0 auto}
.trio .who b{color:var(--coral);font-size:15px;display:block;margin-bottom:2px}
.trio .who span{font-size:13.5px;line-height:1.6;color:var(--ink-soft)}

/* 딜레마 2단 */
.duo{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.duo .box{background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px}
.duo .box b{display:block;margin-bottom:6px;font-size:15px}
.duo .box.easy b{color:var(--coral)}
.duo .box.hard b{color:#4a5285}
.duo .box span{font-size:13.5px;line-height:1.75;color:var(--ink-soft)}

/* 3점 */
.big3{display:flex;align-items:center;gap:20px}
.big3 .num{font-family:'Gowun Batang',serif;font-size:88px;font-weight:700;color:var(--coral);line-height:1;flex:0 0 auto}
.big3 .num small{font-size:30px}

/* 명언 */
.slide.quote .spread{background:linear-gradient(180deg,#232a4e,#181d38)}
.slide.quote .page{justify-content:center}
.slide.quote blockquote{
  font-family:'Gowun Batang',serif;font-size:27px;line-height:2;
  color:#ffe9a8;text-align:center;
}
.slide.quote figcaption{text-align:center;color:var(--coral);font-size:16px;margin-top:16px;letter-spacing:.06em}

/* ── 퀴즈 페이지 ─────────────────── */
.q-head{display:flex;gap:14px;align-items:flex-start}
.q-no{
  flex:0 0 auto;display:inline-flex;align-items:center;justify-content:center;
  min-width:52px;height:52px;border-radius:14px;
  background:var(--night);color:var(--gold);font-family:'Gowun Batang',serif;
  font-weight:700;font-size:20px;padding:0 12px;
}
.q-head h2{font-size:21px;line-height:1.6}
.q-zone{position:relative;flex:1;display:flex;flex-direction:column;min-height:0}
.opts{display:flex;flex-direction:column;gap:10px;flex:1;justify-content:center}
.opt{
  text-align:left;font:inherit;font-size:15.5px;line-height:1.55;color:var(--ink);
  background:#fff;border:1.5px solid var(--line);border-radius:13px;
  padding:12px 15px;cursor:pointer;display:flex;gap:11px;align-items:center;
  transition:border-color .15s, background .15s, transform .1s;
}
.opt .n{
  flex:0 0 auto;width:26px;height:26px;border-radius:50%;
  border:1.5px solid var(--gold-deep);color:var(--gold-deep);
  display:inline-flex;align-items:center;justify-content:center;
  font-size:13px;font-weight:700;
}
.opt:not(.locked):hover{border-color:var(--gold-deep);transform:translateY(-1px)}
.opt:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.opt.correct{background:#eef6ec;border-color:var(--sage-deep)}
.opt.correct .n{background:var(--sage-deep);border-color:var(--sage-deep);color:#fff}
.opt.wrong{background:#fdeeea;border-color:var(--coral)}
.opt.wrong .n{background:var(--coral);border-color:var(--coral);color:#fff}
.opt.dim{opacity:.45}

/* 해설: 보기 영역 위 양피지 오버레이 → 스크롤 없이 그 자리에서 표시 */
.reveal{
  position:absolute;inset:0;display:none;flex-direction:column;gap:10px;
  background:linear-gradient(180deg,#fff8e6,#fdf0cf);
  border:1.5px dashed var(--gold-deep);border-radius:16px;
  padding:20px 22px;
}
.reveal.show{display:flex;animation:pop .3s ease}
@keyframes pop{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.reveal .verdict{font-size:18px;font-weight:700}
.reveal .verdict.ok{color:var(--sage-deep)}
.reveal .verdict.no{color:var(--coral)}
.reveal .ans{font-size:15px;color:var(--ink);background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px 14px;line-height:1.6}
.reveal .tag{font-size:13.5px;font-weight:700;color:var(--gold-deep);letter-spacing:.08em}
.reveal p{font-size:15px;line-height:1.9;color:var(--ink-soft)}
.reveal .back{
  align-self:flex-end;margin-top:auto;font:inherit;font-size:13.5px;color:var(--ink-soft);
  background:none;border:1px solid var(--line);border-radius:999px;padding:7px 16px;cursor:pointer;
}
.reveal .back:hover{border-color:var(--gold-deep);color:var(--gold-deep)}

/* 결과 */
.result-num{font-family:'Gowun Batang',serif;font-size:74px;font-weight:700;color:var(--gold-deep);text-align:center}
.result-num small{font-size:28px;color:var(--ink-soft)}
.result-msg{text-align:center;font-size:17px;line-height:1.9;color:var(--ink-soft)}
.restart{
  align-self:center;font:inherit;font-weight:700;font-size:16px;color:var(--night);
  background:var(--gold);border:none;border-radius:999px;padding:13px 32px;cursor:pointer;
  box-shadow:0 6px 16px rgba(224,164,40,.35);transition:transform .12s;
}
.restart:hover{transform:translateY(-2px)}

/* 하단 내비 */
nav.deck-nav{height:64px;display:flex;align-items:center;justify-content:center;gap:16px;padding:0 20px}
.nav-btn{
  width:46px;height:46px;border-radius:50%;border:1.5px solid rgba(245,198,79,.55);
  background:rgba(255,249,236,.08);color:var(--gold);font-size:22px;cursor:pointer;
  display:flex;align-items:center;justify-content:center;transition:background .15s,opacity .15s;
}
.nav-btn:hover{background:rgba(245,198,79,.18)}
.nav-btn:disabled{opacity:.25;cursor:default}
.nav-btn:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.dots{display:flex;gap:7px;align-items:center}
.dots i{width:8px;height:8px;border-radius:50%;background:rgba(244,234,208,.28);transition:all .25s;cursor:pointer}
.dots i.on{background:var(--gold);width:22px;border-radius:99px}
.dots i.quiz-dot{border:1px solid rgba(245,198,79,.5);background:transparent}
.dots i.quiz-dot.done{background:var(--sage);border-color:var(--sage)}
.dots i.quiz-dot.on{background:var(--gold);border-color:var(--gold)}
</style>
</head>
<body>
<div class="sky" id="sky" aria-hidden="true"></div>

<div id="stage">
  <header>
    <div class="brand serif">🌰 <b>쿼카의 마법 그림 카드</b> · 양면 그림책</div>
    <span class="score-chip" id="scoreChip">⭐ <span id="scoreVal">0</span>/10</span>
    <div class="count" id="pageCount">1 / 20</div>
  </header>

  <main class="deck">
    <div class="deck-track" id="track" aria-label="양면 슬라이드. 좌우 버튼, 화살표 키, 스와이프로 넘겨보세요"></div>
  </main>

  <nav class="deck-nav" aria-label="슬라이드 이동">
    <button class="nav-btn" id="prevBtn" aria-label="이전 페이지">‹</button>
    <div class="dots" id="dots"></div>
    <button class="nav-btn" id="nextBtn" aria-label="다음 페이지">›</button>
  </nav>
</div>

<script>
/* ─────────────────────────────────────────
   회화 일러스트 (인라인 SVG · 수채 감성)
   preserveAspectRatio slice → 액자를 가득 채움
────────────────────────────────────────── */
function framed(inner){
  return `<svg viewBox="0 0 600 300" preserveAspectRatio="xMidYMid slice" role="img">${inner}</svg>`;
}
const ART = {};

/* 별빛 내리는 숲 + 등불 */
ART.forest = framed(`
 <defs>

  </linearGradient>
  <radialGradient id="glow" cx=".5" cy=".5" r=".5">
   <stop offset="0" stop-color="#ffe08a" stop-opacity=".95"/><stop offset="1" stop-color="#ffb057" stop-opacity="0"/>
  </radialGradient>
 </defs>
 <rect width="600" height="300" fill="url(#fSky)"/>
 <g fill="#ffedb3">
  <circle cx="60" cy="40" r="2"/><circle cx="140" cy="70" r="1.6"/><circle cx="230" cy="35" r="2.2"/>
  <circle cx="330" cy="60" r="1.7"/><circle cx="430" cy="30" r="2"/><circle cx="520" cy="65" r="1.8"/>
  <circle cx="560" cy="120" r="1.5"/><circle cx="90" cy="110" r="1.5"/>
 </g>
 <g class="float-star">
  <circle cx="180" cy="140" r="26" fill="url(#glow)"/><circle cx="180" cy="140" r="6" fill="#ffdd7a"/>
  <circle cx="300" cy="105" r="30" fill="url(#glow)"/><circle cx="300" cy="105" r="7" fill="#ffdd7a"/>
  <circle cx="420" cy="150" r="24" fill="url(#glow)"/><circle cx="420" cy="150" r="5.5" fill="#ffdd7a"/>
  <circle cx="510" cy="115" r="20" fill="url(#glow)"/><circle cx="510" cy="115" r="5" fill="#ffdd7a"/>
  <circle cx="100" cy="170" r="20" fill="url(#glow)"/><circle cx="100" cy="170" r="5" fill="#ffdd7a"/>
 </g>
 <path d="M0 300 L0 235 Q40 200 60 235 L75 190 Q95 160 112 190 L128 235 Q160 205 178 235 L195 175 Q215 140 233 175 L250 235 Q280 208 298 235 L318 185 Q338 152 356 185 L372 235 Q402 205 420 235 L438 178 Q458 145 476 178 L492 235 Q522 208 540 235 L558 195 Q578 165 600 195 L600 300 Z" fill="#1a1f3a"/>
 <path d="M0 300 L0 262 Q70 240 140 262 Q220 240 300 262 Q380 238 460 262 Q540 242 600 262 L600 300 Z" fill="#141830"/>
 <ellipse cx="300" cy="292" rx="330" ry="26" fill="#0f1328"/>`);

/* 민들레 = 땅에 내려앉은 별빛 */
ART.dandelion = framed(`
 <defs>
  <linearGradient id="dSky" x1="0" y1="0" x2="0" y2="1">
   <stop offset="0" stop-color="#1f2648"/><stop offset="1" stop-color="#454f86"/>
  </linearGradient>
  <radialGradient id="dGlow" cx=".5" cy=".5" r=".5">
   <stop offset="0" stop-color="#ffe37f" stop-opacity=".9"/><stop offset="1" stop-color="#ffd23e" stop-opacity="0"/>
  </radialGradient>
 </defs>
 <rect width="600" height="300" fill="url(#dSky)"/>
 <g fill="#fff3c4"><circle cx="80" cy="50" r="2"/><circle cx="200" cy="30" r="1.7"/><circle cx="320" cy="55" r="2.1"/><circle cx="450" cy="35" r="1.8"/><circle cx="545" cy="70" r="2"/></g>
 <g stroke="#ffe9a0" stroke-width="1" opacity=".55">
  <path d="M120 60 L135 150" stroke-dasharray="3 6"/><path d="M380 45 L360 140" stroke-dasharray="3 6"/><path d="M500 80 L480 165" stroke-dasharray="3 6"/>
 </g>
 <path d="M0 300 L0 210 Q150 180 300 205 Q450 182 600 208 L600 300 Z" fill="#28315b"/>
 <path d="M0 300 L0 245 Q160 222 300 242 Q460 220 600 246 L600 300 Z" fill="#1d2444"/>
 <g class="float-star">
  ${[ [90,215],[170,235],[250,210],[335,238],[420,214],[505,236],[560,212] ].map(([x,y])=>`
   <g>
    <circle cx="${x}" cy="${y}" r="22" fill="url(#dGlow)"/>
    <line x1="${x}" y1="${y+8}" x2="${x}" y2="${y+34}" stroke="#5d7a4f" stroke-width="3" stroke-linecap="round"/>
    <circle cx="${x}" cy="${y}" r="9" fill="#ffd23e"/>
    <circle cx="${x}" cy="${y}" r="4.5" fill="#f5a623"/>
   </g>`).join('')}
 </g>`);

/* 모닥불 숲 친구들 */
ART.campfire = framed(`
 <defs>
  <linearGradient id="cSky" x1="0" y1="0" x2="0" y2="1">
   <stop offset="0" stop-color="#232a4f"/><stop offset="1" stop-color="#3c3a5e"/>
  </linearGradient>
  <radialGradient id="fireGlow" cx=".5" cy=".55" r=".55">
   <stop offset="0" stop-color="#ffb35c" stop-opacity=".85"/><stop offset="1" stop-color="#ffb35c" stop-opacity="0"/>
  </radialGradient>
 </defs>
 <rect width="600" height="300" fill="url(#cSky)"/>
 <g fill="#ffedb3"><circle cx="70" cy="45" r="2"/><circle cx="180" cy="28" r="1.6"/><circle cx="470" cy="40" r="2"/><circle cx="545" cy="75" r="1.6"/></g>
 <g fill="#1a2038">
  <path d="M40 300 L60 90 L80 300 Z"/><path d="M120 300 L138 60 L156 300 Z"/>
  <path d="M470 300 L488 70 L506 300 Z"/><path d="M545 300 L562 100 L579 300 Z"/>
 </g>
 <ellipse cx="300" cy="286" rx="320" ry="26" fill="#161a30"/>
 <circle cx="300" cy="215" r="120" fill="url(#fireGlow)"/>
 <g stroke="#7a4b2c" stroke-width="9" stroke-linecap="round">
  <line x1="268" y1="252" x2="332" y2="238"/><line x1="270" y1="238" x2="330" y2="252"/>
 </g>
 <g class="float-star">
  <path d="M300 178 C288 200 288 214 300 226 C312 214 312 198 300 178Z" fill="#ff9d3e"/>
  <path d="M300 192 C293 206 293 214 300 221 C307 214 307 204 300 192Z" fill="#ffd23e"/>
 </g>
 <g transform="translate(180 200)">
  <ellipse cx="0" cy="30" rx="26" ry="30" fill="#e8d6bd"/>
  <circle cx="0" cy="-6" r="19" fill="#efe0ca"/>
  <path d="M-12 -20 Q-16 -52 -6 -52 Q0 -50 -4 -20Z" fill="#efe0ca"/>
  <path d="M12 -20 Q16 -52 6 -52 Q0 -50 4 -20Z" fill="#efe0ca"/>
  <circle cx="-6" cy="-8" r="2.4" fill="#3a3550"/><circle cx="6" cy="-8" r="2.4" fill="#3a3550"/>
  <path d="M-3 0 Q0 3 3 0" stroke="#3a3550" stroke-width="1.6" fill="none" stroke-linecap="round"/>
 </g>
 <g transform="translate(300 128)">
  <ellipse cx="0" cy="18" rx="24" ry="27" fill="#a58a6d"/>
  <ellipse cx="0" cy="24" rx="14" ry="18" fill="#e9d8bd"/>
  <circle cx="-8" cy="2" r="8" fill="#f6ecd8"/><circle cx="8" cy="2" r="8" fill="#f6ecd8"/>
  <circle cx="-8" cy="2" r="3" fill="#3a3550"/><circle cx="8" cy="2" r="3" fill="#3a3550"/>
  <path d="M0 6 L-4 12 L4 12 Z" fill="#e0a428"/>
  <path d="M-16 -8 L-8 -14 M16 -8 L8 -14" stroke="#a58a6d" stroke-width="5" stroke-linecap="round"/>
 </g>
 <g transform="translate(420 202)">
  <ellipse cx="0" cy="30" rx="27" ry="29" fill="#e58a54"/>
  <circle cx="0" cy="-4" r="19" fill="#ef9a63"/>
  <path d="M-14 -14 L-20 -36 L-2 -22Z" fill="#ef9a63"/><path d="M14 -14 L20 -36 L2 -22Z" fill="#ef9a63"/>
  <ellipse cx="0" cy="4" rx="9" ry="7" fill="#fbe9d6"/>
  <circle cx="-7" cy="-6" r="2.4" fill="#3a3550"/><circle cx="7" cy="-6" r="2.4" fill="#3a3550"/>
  <circle cx="0" cy="2" r="2.4" fill="#3a3550"/>
  <path d="M24 34 Q46 26 42 8 Q52 26 30 42Z" fill="#e58a54"/>
 </g>`);

/* 마음의 온도계 */
ART.thermo = framed(`

const track = document.getElementById('track');
const slides = [];

function addSlide(cls, art, cap, pageHtml){
  const s = document.createElement('section');
  s.className = 'slide' + (cls ? ' ' + cls : '');
  s.innerHTML = `
   <article class="spread">
    <div class="plate">
      <div class="frame">${art}<div class="caption serif">${cap}</div></div>
    </div>
    <div class="page">${pageHtml}</div>
   </article>`;
  track.appendChild(s);
  slides.push(s);
  return s;
}

      answered.add(qi);
      const pick = +btn.dataset.i;
      const ok = pick === qz.a;
      if (ok) score++;
      scoreVal.textContent = score;
      scoreChip.classList.add('show');
      opts.forEach((b,i)=>{
        b.classList.add('locked');
        if (i === qz.a) b.classList.add('correct');
        else if (i === pick) b.classList.add('wrong');
        else b.classList.add('dim');
      });
      verdict.textContent = ok
        ? "🎉 정답이에요! 훌륭한 교감이었어요."
        : "💫 아쉬워요! 정답을 확인해 보세요.";
      verdict.className = 'verdict ' + (ok ? 'ok' : 'no');
      reveal.classList.add('show');
      const dot = dots[slides.indexOf(slide)];
      if (dot) dot.classList.add('done');
      updateFinal();
    });
  });
});

function updateFinal(){
  document.getElementById('finalScore').textContent = score;
  const msg = document.getElementById('finalMsg');
  if (answered.size === 0) return;
  if (score >= 9) msg.textContent = "완벽한 이야기꾼의 탄생! 쿼카가 가장 아끼는 마법 카드를 선물하고 싶어 해요. ⭐";
  else if (score >= 6) msg.textContent = "따스한 은유의 별빛이 마음에 스며들었어요. 멋진 교감이었습니다!";
  else if (score >= 3) msg.textContent = "좋은 출발이에요! 동화 책장을 다시 넘겨보면 별빛 힌트가 더 선명해질 거예요.";
  else msg.textContent = "괜찮아요, 수수께끼는 여러 번 여행할수록 빛나요. 처음부터 다시 함께 걸어볼까요?";
}

document.getElementById('restartBtn').addEventListener('click', ()=>{
  score = 0; answered.clear();
  scoreVal.textContent = 0; scoreChip.classList.remove('show');
  document.querySelectorAll('.quiz-slide').forEach(slide=>{
    slide.querySelectorAll('.opt').forEach(b=>b.classList.remove('correct','wrong','dim','locked'));
    slide.querySelector('.reveal').classList.remove('show');
  });
  dots.forEach(d=>d.classList.remove('done'));
  document.getElementById('finalScore').textContent = 0;
  updateFinalReset();
  goTo(0);
});
function updateFinalReset(){
  document.getElementById('finalMsg').textContent = "퀴즈 여행을 정답게 동참해 주셔서 깊이 감사드립니다.";
}

/* ─────────────────────────────────────────
   페이지 이동 (트랙은 transform 이동 · 스크롤 없음)
────────────────────────────────────────── */
const prevBtn = document.getElementById('prevBtn');
const nextBtn = document.getElementById('nextBtn');
const pageCount = document.getElementById('pageCount');
let cur = 0;

function goTo(i){
  cur = Math.max(0, Math.min(slides.length-1, i));
  slides.forEach(s=>s.style.transform = `translateX(${-cur*100}%)`);
  dots.forEach((d,j)=>d.classList.toggle('on', j===cur));
  pageCount.textContent = `${cur+1} / ${slides.length}`;
  prevBtn.disabled = cur === 0;
  nextBtn.disabled = cur === slides.length - 1;
}
prevBtn.addEventListener('click', ()=>goTo(cur-1));
nextBtn.addEventListener('click', ()=>goTo(cur+1));
document.addEventListener('keydown', e=>{
  if (e.key === 'ArrowRight') goTo(cur+1);
  if (e.key === 'ArrowLeft') goTo(cur-1);
});

/* 스와이프 */
let sx=null, sy=null;
const stage = document.getElementById('stage');
stage.addEventListener('touchstart', e=>{
  sx = e.touches[0].clientX; sy = e.touches[0].clientY;
}, {passive:true});
stage.addEventListener('touchend', e=>{
  if (sx===null) return;
  const dx = e.changedTouches[0].clientX - sx;
  const dy = e.changedTouches[0].clientY - sy;
  if (Math.abs(dx) > 46 && Math.abs(dx) > Math.abs(dy)*1.4){
    goTo(cur + (dx < 0 ? 1 : -1));
  }
  sx = sy = null;
}, {passive:true});

/* ─────────────────────────────────────────
   스테이지 스케일링: 1280×720을 화면에 꽉 맞춤 → 스크롤 없음
────────────────────────────────────────── */
function fit(){
  const s = Math.min(window.innerWidth / 1280, window.innerHeight / 720) * 0.985;
  stage.style.transform = `scale(${s})`;
}
window.addEventListener('resize', fit);
fit();

/* 밤하늘 별 */
const sky = document.getElementById('sky');
for (let i=0;i<42;i++){
  const st = document.createElement('i');
  st.style.left = Math.random()*100 + 'vw';
  st.style.top = Math.random()*100 + 'vh';
  st.style.animationDelay = (Math.random()*3.4).toFixed(2) + 's';
  st.style.width = st.style.height = (1.6 + Math.random()*2.2).toFixed(1) + 'px';
  sky.appendChild(st);
}

goTo(0);
</script>
